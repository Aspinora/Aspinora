<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/aspinora-logo.png">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2T21NS52RF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-2T21NS52RF');
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aspinora — Choose Your Exam</title>
  <style>
    :root {
      --orange: #ff7800;
      --orange-dark: #e85d00;
      --ink: #172033;
      --muted: #6d7585;
      --line: #edf0f5;
      --surface: #ffffff;
      --soft: #fff7ef;
      --shadow: 0 18px 55px rgba(34, 45, 72, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, #fffaf5 0%, #ffffff 45%, #fff8ef 100%);
    }

    button { font: inherit; }

    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .topbar {
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      padding: 7px 10px 7px 3px;
      border-radius: 14px;
      transition: background .2s ease, transform .2s ease;
    }

    .brand:hover { background: #fff0e3; transform: translateY(-1px); }

    .brand img {
      width: 43px;
      height: 43px;
      object-fit: contain;
      border-radius: 50%;
      box-shadow: 0 5px 14px rgba(255, 120, 0, .2);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .brand-name span { color: var(--orange); }

    .menu-wrap { position: relative; }


    .menu-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 14px;
      color: #505b70;
      background: transparent;
      cursor: pointer;
      transition: all .2s ease;
    }

    .menu-button:hover, .menu-button[aria-expanded="true"] {
      color: var(--orange-dark);
      background: #fff0e3;
      border-color: #ffe2ca;
    }

    .dots { display: flex; gap: 4px; }
    .dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    .menu-panel {
      position: absolute;
      top: 53px;
      right: 0;
      z-index: 20;
      width: 245px;
      padding: 10px;
      background: white;
      border: 1px solid #f0e9e2;
      border-radius: 18px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(-8px) scale(.97);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .menu-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-label {
      padding: 8px 10px 7px;
      color: #a0a6b2;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 10px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #394255;
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      transition: background .16s ease, color .16s ease;
    }

    .menu-item:hover { background: #fff6ee; color: var(--orange-dark); }

    .menu-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      font-size: 14px;
      flex-shrink: 0;
    }

    .orange { background: #fff0e1; color: #f16d00; }
    .blue { background: #eaf4ff; color: #367dd7; }
    .purple { background: #f2edff; color: #7957db; }
    .green { background: #eaf9f1; color: #239363; }
    .red { background: #ffe9e9; color: #e5484d; }

    .menu-profile { margin-bottom: 6px; cursor: default; }
    .menu-item.menu-profile:hover { background: transparent; color: #394255; }
    .menu-avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, #ff9a32, #f26400); color: white; font-size: 13px; font-weight: 800; flex-shrink: 0; box-shadow: 0 4px 10px rgba(238, 108, 8, .22); overflow: hidden; }
    .menu-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .menu-profile-info { display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
    .menu-profile-name { font-size: 13.5px; font-weight: 750; color: #273146; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu-profile-sub { font-size: 11px; color: #a0a6b2; font-weight: 650; }
    .menu-divider { height: 1px; background: #f0e9e2; margin: 6px 6px; }

    .selection {
      min-height: 505px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 58px 7%;
      overflow: hidden;
      border: 1px solid #f8e6d6;
      border-radius: 30px;
      background:
        radial-gradient(circle at 86% 14%, #fff3e5 0 12%, transparent 33%),
        linear-gradient(120deg, #fff 0%, #fffaf6 100%);
      box-shadow: 0 16px 50px rgba(193, 117, 43, .07);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 8px 13px;
      border-radius: 99px;
      color: #e56b14;
      background: #fff0e2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .eyebrow::before { content: "✦"; font-size: 13px; }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(38px, 5vw, 60px);
      line-height: 1;
      letter-spacing: -3px;
    }

    h1 em {
      color: var(--orange);
      font-style: normal;
    }

    .intro {
      max-width: 650px;
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 780px;
    }

    .exam-card {
      position: relative;
      min-height: 180px;
      padding: 28px;
      text-align: left;
      border: 1px solid #eceff4;
      border-radius: 20px;
      background: rgba(255,255,255,.92);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(44, 54, 78, .06);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .exam-card:hover {
      transform: translateY(-4px);
      border-color: #ffd0a8;
      box-shadow: 0 16px 35px rgba(193, 117, 43, .12);
    }

    .exam-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 12px;
      background: #fff0e1;
      color: var(--orange-dark);
      font-weight: 900;
      font-size: 15px;
    }

    .exam-card:nth-child(2) .exam-icon {
      background: #eaf4ff;
      color: #367dd7;
    }

    .exam-card h2 {
      margin: 0 0 7px;
      font-size: 22px;
      letter-spacing: -.5px;
    }

    .exam-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .arrow {
      position: absolute;
      right: 24px;
      bottom: 22px;
      color: #a1a8b5;
      font-size: 20px;
      transition: transform .2s ease, color .2s ease;
    }

    .exam-card:hover .arrow {
      color: var(--orange);
      transform: translateX(4px);
    }

    .status {
      min-height: 22px;
      margin-top: 16px;
      color: #e56b14;
      font-size: 13px;
      font-weight: 650;
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 22px, 590px); }
      .topbar { height: 72px; }
      .selection { min-height: 505px; padding: 36px 24px; }
      h1 { letter-spacing: -2px; }
      .exam-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Return to Aspinora homepage">
        <img src="/aspinora-logo.png" alt="Aspinora logo" />
        <span class="brand-name">Aspi<span>nora</span></span>
      </button>

      <div class="menu-wrap">
        <button class="menu-button" id="menuButton" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel">
          <span class="dots"><i></i><i></i><i></i></span>
        </button>

        <nav class="menu-panel" id="menuPanel" aria-label="Quick navigation">
          <button class="menu-item menu-profile" id="menuProfileItem" style="display:none;">
            <span class="menu-avatar" id="menuAvatar">A</span>
            <span class="menu-profile-info">
              <span class="menu-profile-name" id="menuProfileName">Aspirant</span>
              <span class="menu-profile-sub" id="menuProfileSub">Joined recently</span>
            </span>
          </button>
          <div class="menu-label">Explore Aspinora</div>
          <a class="menu-item" href="/dashboard/"><span class="menu-icon orange">⌂</span>Dashboard</a>
          <button class="menu-item" data-message="Study planner selected"><span class="menu-icon blue">▣</span>Study planner</button>
          <button class="menu-item" data-message="Current affairs selected"><span class="menu-icon purple">✦</span>Current affairs</button>
          <button class="menu-item" data-message="Saved notes selected"><span class="menu-icon green">♡</span>Saved notes</button>
          <a class="menu-item" href="/mock-tests/"><span class="menu-icon orange">◈</span>Mock tests</a>
          <a class="menu-item" href="/score-calculator/"><span class="menu-icon blue">▤</span>Calculators</a>
          <button class="menu-item" data-message="Rank/Score tools coming soon."><span class="menu-icon purple">◔</span>Rank/Score tools</button>
          <button class="menu-item" data-message="Important links coming soon."><span class="menu-icon green">⚑</span>Important links</button>
          <button class="menu-item" data-message="More utilities coming soon."><span class="menu-icon orange">≡</span>Other useful utilities</button>
          <div class="menu-divider" id="menuAccountDivider" style="display:none;"></div>
          <button class="menu-item" id="menuUpdateProfileButton" style="display:none;"><span class="menu-icon blue">✎</span>Update Profile</button>
          <button class="menu-item menu-logout" id="menuLogoutButton" style="display:none;"><span class="menu-icon red">⏻</span>Log Out</button>
        </nav>
      </div>
    </div></header>

    <section class="selection">
      <div class="eyebrow">Choose your preparation</div>
      <h1>Start learning, <em>your way.</em></h1>
      <p class="intro">
        Select the examination you are preparing for and continue to your dedicated study resources.
      </p>

      <div class="exam-grid">
        <button class="exam-card" onclick="selectExam('SSC CGL')">
          <div class="exam-icon">CGL</div>
          <h2>SSC CGL</h2>
          <p>Notes, resources and preparation material for Combined Graduate Level.</p>
          <span class="arrow">→</span>
        </button>

        <button class="exam-card" onclick="window.location.href='/ib-acio/'">
          <div class="exam-icon">IB</div>
          <h2>IB ACIO</h2>
          <p>Preparation resources and study material for Intelligence Bureau ACIO.</p>
          <span class="arrow">→</span>
        </button>
      </div>

      <div class="status" id="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const menuButton = document.getElementById('menuButton');
    const menuPanel = document.getElementById('menuPanel');
    const status = document.getElementById('status');

    function setStatus(message) {
      status.textContent = message;
      window.setTimeout(() => { status.textContent = ''; }, 2800);
    }

    menuButton.addEventListener('click', (event) => {
      event.stopPropagation();
      const isOpen = menuPanel.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) {
        menuPanel.classList.remove('open');
        menuButton.setAttribute('aria-expanded', 'false');
      }
    });

    document.querySelectorAll('[data-message]').forEach((button) => {
      button.addEventListener('click', () => {
        setStatus(button.dataset.message);
        menuPanel.classList.remove('open');
        menuButton.setAttribute('aria-expanded', 'false');
      });
    });

    document.getElementById('homeButton').addEventListener('click', () => {
      window.location.href = '/';
    });

    /* ============================================================
       SUPABASE — logged-in state for the triple-dot menu
    ============================================================ */
    const SUPABASE_URL = 'https://tcufgyrhkpzkeyiffnaw.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rhTVneW41uHvEX6PRkl8qw_mZ8BgQ9n';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    async function checkSessionAndUpdateMenu() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const user = session.user;
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('username, created_at, avatar_url')
        .eq('id', user.id)
        .single();

      const username = profile?.username || user.email.split('@')[0];
      const joinedDate = profile?.created_at ? new Date(profile.created_at) : new Date(user.created_at);
      const options = { month: 'long', year: 'numeric' };

      const menuAvatar = document.getElementById('menuAvatar');
      if (profile?.avatar_url) {
        menuAvatar.innerHTML = '';
        const avatarImg = document.createElement('img');
        avatarImg.src = profile.avatar_url;
        avatarImg.alt = username + '\u2019s profile photo';
        menuAvatar.appendChild(avatarImg);
      } else {
        menuAvatar.textContent = username.charAt(0).toUpperCase();
      }
      document.getElementById('menuProfileName').textContent = username;
      document.getElementById('menuProfileSub').textContent = 'Joined ' + joinedDate.toLocaleDateString('en-US', options);
      document.getElementById('menuProfileItem').style.display = 'flex';
      document.getElementById('menuAccountDivider').style.display = 'block';
      document.getElementById('menuUpdateProfileButton').style.display = 'flex';
      document.getElementById('menuLogoutButton').style.display = 'flex';
    }

    document.getElementById('menuUpdateProfileButton').addEventListener('click', () => {
      menuPanel.classList.remove('open');
      menuButton.setAttribute('aria-expanded', 'false');
      window.location.href = '/edit-profile/';
    });

    document.getElementById('menuLogoutButton').addEventListener('click', async () => {
      menuPanel.classList.remove('open');
      menuButton.setAttribute('aria-expanded', 'false');
      setStatus('Logging out…');
      await supabaseClient.auth.signOut();
      setTimeout(() => { window.location.href = '/'; }, 600);
    });

    checkSessionAndUpdateMenu();

    function selectExam(exam) {
      setStatus(exam + ' selected.');
      // Add the destination page here when the SSC CGL and IB ACIO pages are created.
    }
  </script>
</body>
</html>
