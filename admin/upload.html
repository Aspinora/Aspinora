<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload PYQ — Aspinora Admin</title>
<style>
  :root{
    --orange:#ff7800;--orange-dark:#e85d00;--ink:#172033;--muted:#6d7585;
    --line:#edf0f5;--shadow:0 18px 55px rgba(34,45,72,.08);--red:#e5484d;--green:#3ecf7a;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(145deg,#fffaf5 0%,#ffffff 45%,#fff8ef 100%);color:var(--ink)}
  .page{width:min(680px, calc(100% - 36px));margin:0 auto;padding-bottom:60px}
  .topbar{height:86px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#ff9a32,#f26400);display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px}
  .brand-name{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .brand-name span{color:var(--orange)}
  .back{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;color:#687286;cursor:pointer;font-size:12.5px;font-weight:700}
  .back:hover{color:var(--orange-dark);border-color:#ffcc9e}

  .card{padding:32px;border:1px solid #f8e6d6;border-radius:24px;background:#fff;box-shadow:var(--shadow)}
  h1{font-size:21px;margin:0 0 6px}
  p.sub{color:var(--muted);font-size:13.5px;margin:0 0 26px;line-height:1.5}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;font-size:12.5px;font-weight:700;color:#394255;margin:14px 0 6px}
  input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;background:#fff}
  input:focus,select:focus{outline:2px solid #ffd0a8;border-color:var(--orange)}
  .file-drop{margin-top:14px;border:2px dashed #ffd0a8;border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:13.5px;background:#fffaf5}
  .file-drop.has-file{color:var(--ink);font-weight:650;border-style:solid;border-color:#ffc188}
  button.submit{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  button.submit:hover{background:var(--orange-dark)}
  button.submit:disabled{opacity:.6;cursor:not-allowed}
  .status{min-height:20px;margin-top:16px;font-size:13.5px;font-weight:650}
  .status.error{color:var(--red)}
  .status.ok{color:#1c8f57}
  .status.progress{color:#a5720a}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:#fff;font-size:13.5px;font-weight:700;color:#394255;cursor:pointer}
  .chip:hover{border-color:#ffd0a8}
  .chip.selected{background:var(--orange);border-color:var(--orange);color:#fff}
  .tier-chip{flex:1;text-align:center;padding:13px}
  input[type=date]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;background:#fff}
  .date-preview{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:650}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <button class="back" onclick="window.location.href='dashboard.html'">← Dashboard</button>
    <div class="brand"><div class="brand-mark">A</div><div class="brand-name">Aspi<span>nora</span> Admin</div></div>
  </header>

  <div class="card">
    <h1>Upload PYQ Paper</h1>
    <p class="sub">The PDF is saved as a draft and automatically processed. Nothing is ever published until every question is reviewed and approved.</p>

    <form id="uploadForm">
      <label>Exam</label>
      <input type="text" id="examName" value="SSC CGL" required readonly style="background:#fafbfd;color:#687286">

      <label>Year</label>
      <div class="chip-row" id="yearChips"></div>

      <div id="tierBlock" style="display:none">
        <label>Tier</label>
        <div class="chip-row" id="tierChips"></div>
      </div>

      <div id="dateBlock" style="display:none">
        <label>Exam date</label>
        <div class="chip-row" id="dateChips"></div>
      </div>

      <div id="shiftBlock" style="display:none">
        <label>Shift / Session</label>
        <div class="chip-row" id="shiftChips"></div>
      </div>

      <label for="pdfFile">PYQ PDF file</label>
      <input type="file" id="pdfFile" accept="application/pdf" required style="display:none">
      <div class="file-drop" id="fileDrop">Click to choose a PDF, or drag one here</div>

      <button type="submit" class="submit" id="submitBtn">Upload &amp; start extraction</button>
      <div class="status" id="status"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://tcufgyrhkpzkeyiffnaw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rhTVneW41uHvEX6PRkl8qw_mZ8BgQ9n';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  let session = null;
  let selectedYear = null;
  let selectedTier = null;
  let selectedDate = null;
  let selectedShift = null;

  // This is the SAME reference schedule used on the student-facing
  // mock-tests picker (mock-tests/index.html) — kept in sync manually so
  // the admin picks from real, existing exam slots instead of typing dates
  // that might not exactly match what students see.
  const EXAM_SCHEDULE = {
    2025: {
      tier1: { dates: ["12 Sep 2025","13 Sep 2025","14 Sep 2025","15 Sep 2025","16 Sep 2025","17 Sep 2025","18 Sep 2025","19 Sep 2025","20 Sep 2025","21 Sep 2025","22 Sep 2025","23 Sep 2025","24 Sep 2025","25 Sep 2025","26 Sep 2025"], shifts: ["Shift 1","Shift 2","Shift 3"] },
      tier2: { dates: ["18 Jan 2026","19 Jan 2026"], shifts: ["Single Shift"] }
    },
    2024: {
      tier1: { dates: ["9 Sep 2024","10 Sep 2024","11 Sep 2024","12 Sep 2024","13 Sep 2024","17 Sep 2024","18 Sep 2024","19 Sep 2024","23 Sep 2024","24 Sep 2024","25 Sep 2024","26 Sep 2024"], shifts: ["Shift 1","Shift 2","Shift 3"] },
      tier2: { dates: ["18 Jan 2025","19 Jan 2025","20 Jan 2025","31 Jan 2025"], shifts: ["Single Shift"] }
    },
    2023: {
      tier1: { dates: ["14 Jul 2023","17 Jul 2023","18 Jul 2023","19 Jul 2023","20 Jul 2023","21 Jul 2023","24 Jul 2023","25 Jul 2023","26 Jul 2023","27 Jul 2023"], shifts: ["Shift 1","Shift 2","Shift 3","Shift 4"] },
      tier2: { dates: ["2 Mar 2023","3 Mar 2023","6 Mar 2023","7 Mar 2023"], shifts: ["Single Shift"] }
    },
    2022: {
      tier1: { dates: ["1 Dec 2022","2 Dec 2022","3 Dec 2022","5 Dec 2022","6 Dec 2022","7 Dec 2022","8 Dec 2022","9 Dec 2022","12 Dec 2022","13 Dec 2022"], shifts: ["Shift 1","Shift 2","Shift 3","Shift 4"] },
      tier2: { dates: ["2 Mar 2023","3 Mar 2023","6 Mar 2023","7 Mar 2023"], shifts: ["Single Shift"] }
    },
    2021: {
      tier1: { dates: ["13 Aug 2021","16 Aug 2021","17 Aug 2021","23 Aug 2021"], shifts: ["Shift 1","Shift 2","Shift 3"] },
      tier2: { dates: ["8 Aug 2022","10 Aug 2022"], shifts: ["Single Shift"] }
    },
    2020: {
      tier1: { dates: ["3 Mar 2020","4 Mar 2020","5 Mar 2020","6 Mar 2020","7 Mar 2020","9 Mar 2020"], shifts: ["Shift 1","Shift 2","Shift 3"] },
      tier2: { dates: ["28 Jan 2022","29 Jan 2022"], shifts: ["Single Shift"] }
    },
    2019: {
      tier1: { dates: ["4 Jun 2019","6 Jun 2019","7 Jun 2019","10 Jun 2019","11 Jun 2019","12 Jun 2019","13 Jun 2019","19 Jun 2019"], shifts: ["Shift 1","Shift 2","Shift 3"] },
      tier2: { dates: ["11 Sep 2019","12 Sep 2019","13 Sep 2019","14 Sep 2019"], shifts: ["Single Shift"] }
    },
    2018: {
      tier1: { dates: ["4 Jun 2018","6 Jun 2018","7 Jun 2018","11 Jun 2018","12 Jun 2018","13 Jun 2018","14 Jun 2018"], shifts: ["Shift 1","Shift 2","Shift 3"] },
      tier2: { dates: ["11 Sep 2019","12 Sep 2019","13 Sep 2019"], shifts: ["Single Shift"] }
    },
    2017: {
      tier1: { dates: ["5 Aug 2017","6 Aug 2017","8 Aug 2017","9 Aug 2017","10 Aug 2017","11 Aug 2017","12 Aug 2017","16 Aug 2017","17 Aug 2017","18 Aug 2017","19 Aug 2017","20 Aug 2017","21 Aug 2017","22 Aug 2017","23 Aug 2017"], shifts: ["Shift 1 (10:00 AM)","Shift 2 (1:15 PM)","Shift 3 (4:15 PM)"] },
      tier2: { dates: ["17 Feb 2018","18 Feb 2018","19 Feb 2018","20 Feb 2018","21 Feb 2018","22 Feb 2018"], shifts: ["Single Shift"] }
    },
    2016: {
      tier1: { dates: ["27 Aug 2016","28 Aug 2016","29 Aug 2016","30 Aug 2016","31 Aug 2016","1 Sep 2016","2 Sep 2016","3 Sep 2016","4 Sep 2016","5 Sep 2016","6 Sep 2016","7 Sep 2016","8 Sep 2016","9 Sep 2016","10 Sep 2016","11 Sep 2016"], shifts: ["Shift 1 (10:00 AM)","Shift 2 (1:15 PM)","Shift 3 (4:15 PM)"] },
      tier2: { dates: ["30 Nov 2016","1 Dec 2016","2 Dec 2016"], shifts: ["Single Shift"] }
    },
    2015: {
      tier1: { dates: ["9 Aug 2015","16 Aug 2015"], shifts: ["Morning Shift","Evening Shift"] },
      tier2: { dates: ["25 Oct 2015"], shifts: ["Single Shift"] }
    }
  };

  function renderChipRow(container, items, currentValue, onSelect) {
    container.innerHTML = '';
    items.forEach(item => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = item;
      if (item === currentValue) chip.classList.add('selected');
      chip.addEventListener('click', () => {
        onSelect(item);
        container.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', c === chip));
      });
      container.appendChild(chip);
    });
  }

  const yearChipsEl = document.getElementById('yearChips');
  const tierBlock = document.getElementById('tierBlock');
  const tierChipsEl = document.getElementById('tierChips');
  const dateBlock = document.getElementById('dateBlock');
  const dateChipsEl = document.getElementById('dateChips');
  const shiftBlock = document.getElementById('shiftBlock');
  const shiftChipsEl = document.getElementById('shiftChips');

  function resetBelowYear() {
    selectedTier = null; selectedDate = null; selectedShift = null;
    tierBlock.style.display = 'none';
    dateBlock.style.display = 'none';
    shiftBlock.style.display = 'none';
  }
  function resetBelowTier() {
    selectedDate = null; selectedShift = null;
    dateBlock.style.display = 'none';
    shiftBlock.style.display = 'none';
  }

  function showTiersForYear(year) {
    const yearData = EXAM_SCHEDULE[year] || {};
    const tiers = [];
    if (yearData.tier1) tiers.push('Tier 1');
    if (yearData.tier2) tiers.push('Tier 2');
    renderChipRow(tierChipsEl, tiers, selectedTier, (tier) => {
      selectedTier = tier;
      resetBelowTier();
      showDatesForTier(year, tier);
    });
    tierBlock.style.display = tiers.length ? '' : 'none';
  }

  function showDatesForTier(year, tier) {
    const tierKey = tier === 'Tier 2' ? 'tier2' : 'tier1';
    const info = (EXAM_SCHEDULE[year] || {})[tierKey] || { dates: [], shifts: [] };
    renderChipRow(dateChipsEl, info.dates, selectedDate, (date) => {
      selectedDate = date;
      showShiftsForTier(year, tier);
    });
    dateBlock.style.display = info.dates.length ? '' : 'none';
    // If there's only one shift option, auto-select it — no need to make
    // the admin tap a single button.
    if (info.shifts.length === 1) {
      selectedShift = info.shifts[0];
      renderChipRow(shiftChipsEl, info.shifts, selectedShift, (s) => { selectedShift = s; });
      shiftBlock.style.display = '';
    } else {
      shiftBlock.style.display = 'none';
    }
  }

  function showShiftsForTier(year, tier) {
    const tierKey = tier === 'Tier 2' ? 'tier2' : 'tier1';
    const info = (EXAM_SCHEDULE[year] || {})[tierKey] || { dates: [], shifts: [] };
    renderChipRow(shiftChipsEl, info.shifts, selectedShift, (s) => { selectedShift = s; });
    shiftBlock.style.display = info.shifts.length ? '' : 'none';
  }

  const years = Object.keys(EXAM_SCHEDULE).map(Number).sort((a,b) => b - a);
  renderChipRow(yearChipsEl, years, selectedYear, (year) => {
    selectedYear = year;
    resetBelowYear();
    showTiersForYear(year);
  });

  async function guard() {
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    if (!s) { window.location.href = '/auth'; return null; }
    const { data: isAdmin } = await supabaseClient.rpc('is_admin');
    if (!isAdmin) { await supabaseClient.auth.signOut(); window.location.href = '/auth'; return null; }
    return s;
  }

  const fileInput = document.getElementById('pdfFile');
  const fileDrop = document.getElementById('fileDrop');
  fileDrop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) {
      fileDrop.textContent = `Selected: ${fileInput.files[0].name}`;
      fileDrop.classList.add('has-file');
    }
  });
  ['dragover'].forEach(evt => fileDrop.addEventListener(evt, e => { e.preventDefault(); fileDrop.style.background = '#fff3e5'; }));
  ['dragleave','drop'].forEach(evt => fileDrop.addEventListener(evt, e => { e.preventDefault(); fileDrop.style.background = ''; }));
  fileDrop.addEventListener('drop', e => {
    if (e.dataTransfer.files[0]) {
      fileInput.files = e.dataTransfer.files;
      fileDrop.textContent = `Selected: ${e.dataTransfer.files[0].name}`;
      fileDrop.classList.add('has-file');
    }
  });

  // The edge function returns almost immediately after starting a
  // BACKGROUND extraction job (it can take 1-3+ minutes for a full paper).
  // So after invoking it, we poll the paper's row until status settles.
  async function pollUntilDone(paperId, { intervalMs = 4000, timeoutMs = 6 * 60 * 1000 } = {}) {
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      const { data: row, error } = await supabaseClient
        .from('pyq_papers')
        .select('status, last_error, total_questions')
        .eq('id', paperId)
        .single();
      if (error) throw new Error('Could not check extraction status: ' + error.message);

      if (row.status === 'draft') return { ok: true, totalQuestions: row.total_questions };
      if (row.status === 'extraction_failed') return { ok: false, error: row.last_error || 'Extraction failed with no further detail.' };

      const elapsedSec = Math.round((Date.now() - start) / 1000);
      setStatus(`Extracting questions with AI… (${elapsedSec}s elapsed — a full paper can take a few minutes)`, 'progress');
      await new Promise(r => setTimeout(r, intervalMs));
    }
    return { ok: false, error: 'Timed out waiting for extraction after 6 minutes. It may still finish in the background — check the dashboard shortly.' };
  }

  const statusEl = document.getElementById('status');
  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  // supabase-js only gives a generic message on Edge Function errors
  // ("non-2xx status code"); the real reason is in the response body.
  async function describeFunctionError(error) {
    try {
      if (error?.context?.json) {
        const body = await error.context.json();
        return body.detail || body.error || error.message;
      }
      if (error?.context?.text) {
        return await error.context.text();
      }
    } catch (e) { /* fall through */ }
    return error?.message || 'unknown error';
  }

  // Support retrying extraction on an existing paper whose PDF is already uploaded.
  const params = new URLSearchParams(window.location.search);
  const retryPaperId = params.get('retry_paper_id');

  async function retryExisting(paperId) {
    setStatus('Starting extraction…', 'progress');
    document.getElementById('submitBtn').disabled = true;
    const { error } = await supabaseClient.functions.invoke('extract-pyq', { body: { paper_id: paperId } });
    if (error) {
      const detail = await describeFunctionError(error);
      setStatus(`Could not start extraction: ${detail}`, 'error');
      document.getElementById('submitBtn').disabled = false;
      return;
    }
    const result = await pollUntilDone(paperId);
    if (!result.ok) {
      setStatus(`Extraction failed: ${result.error}`, 'error');
      document.getElementById('submitBtn').disabled = false;
      return;
    }
    setStatus(`Extraction complete — ${result.totalQuestions} questions drafted. Redirecting…`, 'ok');
    setTimeout(() => window.location.href = `review.html?paper_id=${paperId}`, 900);
  }

  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');

    const examName = document.getElementById('examName').value.trim();
    const year = selectedYear ? String(selectedYear) : null;
    const tier = selectedTier;
    const examDate = selectedDate;
    const shift = selectedShift;
    const file = fileInput.files[0];

    if (!year) { setStatus('Please select a year.', 'error'); return; }
    if (!tier) { setStatus('Please select a tier.', 'error'); return; }
    if (!examDate) { setStatus('Please select the exam date.', 'error'); return; }
    if (!shift) { setStatus('Please select a shift.', 'error'); return; }
    if (!file) { setStatus('Please choose a PDF file.', 'error'); return; }

    submitBtn.disabled = true;

    try {
      setStatus('Uploading PDF…', 'progress');
      const path = `${examName.replace(/\s+/g,'_')}/${year}/${tier.replace(/\s+/g,'_')}/${Date.now()}_${file.name}`;
      const { error: uploadErr } = await supabaseClient.storage.from('pyq-source-pdfs').upload(path, file, {
        contentType: 'application/pdf', upsert: false,
      });
      if (uploadErr) throw new Error('Upload failed: ' + uploadErr.message);

      setStatus('Creating paper record…', 'progress');
      const { data: paper, error: insertErr } = await supabaseClient
        .from('pyq_papers')
        .insert({
          exam_name: examName, year, tier, exam_date: examDate, shift,
          source_pdf_path: path, status: 'uploaded', created_by: session.user.id,
        })
        .select()
        .single();
      if (insertErr) throw new Error('Could not save paper: ' + insertErr.message);

      setStatus('Starting AI extraction…', 'progress');
      const { error: extractErr } = await supabaseClient.functions.invoke('extract-pyq', {
        body: { paper_id: paper.id },
      });
      if (extractErr) {
        const detail = await describeFunctionError(extractErr);
        setStatus(`Uploaded, but could not start extraction: ${detail}. You can retry from the dashboard.`, 'error');
        submitBtn.disabled = false;
        return;
      }

      const result = await pollUntilDone(paper.id);
      if (!result.ok) {
        setStatus(`Uploaded, but extraction failed: ${result.error}. You can retry from the dashboard.`, 'error');
        submitBtn.disabled = false;
        return;
      }

      setStatus(`Extraction complete — ${result.totalQuestions} questions drafted. Redirecting to review…`, 'ok');
      setTimeout(() => window.location.href = `review.html?paper_id=${paper.id}`, 900);
    } catch (err) {
      setStatus(err.message || 'Something went wrong.', 'error');
      submitBtn.disabled = false;
    }
  });

  (async () => {
    session = await guard();
    if (!session) return;
    if (retryPaperId) {
      document.getElementById('uploadForm').style.display = 'none';
      document.querySelector('h1').textContent = 'Retry extraction';
      document.querySelector('p.sub').textContent = 'Re-running AI extraction on the previously uploaded PDF.';
      retryExisting(retryPaperId);
    }
  })();
</script>
</body>
</html>
