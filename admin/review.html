<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review PYQ — Aspinora Admin</title>
<style>
  :root{
    --orange:#ff7800;--orange-dark:#e85d00;--ink:#172033;--muted:#6d7585;
    --line:#edf0f5;--shadow:0 18px 55px rgba(34,45,72,.08);--red:#e5484d;--green:#3ecf7a;
    --blue:#367dd7;--purple:#7957db;--yellow:#fff200;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f9;color:var(--ink)}
  button{font:inherit;cursor:pointer}
  .app{height:100vh;display:flex;flex-direction:column}

  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .brand-mark{width:32px;height:32px;display:block}
  .brand-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
  .brand-name span{color:var(--orange)}
  .paper-title{flex:1;font-size:14.5px;font-weight:700;color:#394255;text-align:center}
  .progress-pill{flex:0 0 auto;background:#eef1f5;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;color:#394255}
  .progress-pill b{color:#1c8f57}
  .btn{border:0;border-radius:9px;padding:9px 15px;font-weight:750;font-size:13px}
  .btn-primary{background:var(--orange);color:#fff}
  .btn-primary:hover{background:var(--orange-dark)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#394255}
  .btn-ghost:hover{border-color:#ffd0a8;color:var(--orange-dark)}
  .btn-green{background:var(--green);color:#043}
  .btn-green:hover{filter:brightness(.95)}
  .btn-red{background:#ffe9e9;color:var(--red)}
  .btn-red:hover{background:#ffdada}

  .body{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr)}
  .nav{overflow:auto;border-right:1px solid var(--line);background:#fff;padding:16px}
  .nav h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
  .nav h3:first-child{margin-top:0}
  .qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .qnum{height:32px;border-radius:6px;border:0;font-size:12px;font-weight:700;display:grid;place-items:center;background:#eef1f5;color:#8b95a2}
  .qnum.pending{background:#dbe6ff;color:var(--blue)}
  .qnum.needs_review{background:#fff3d6;color:#a5720a}
  .qnum.approved{background:var(--green);color:#043}
  .qnum.rejected{background:#ffe0e0;color:var(--red)}
  .qnum.current{outline:2.5px solid var(--orange);outline-offset:1px}

  .editor{overflow:auto;padding:26px 5% 60px}
  .editor-inner{max-width:760px;margin:0 auto}
  .warn-banner{display:flex;gap:10px;align-items:flex-start;background:#fff3d6;border:1px solid #ffdf9e;color:#7a5300;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;line-height:1.5}
  .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .meta-chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:700;color:#394255}
  .meta-chip.conf-low{border-color:#ffdf9e;background:#fff9ec;color:#a5720a}

  label.field-label{display:block;font-size:12px;font-weight:800;color:#394255;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.4px}
  select,textarea,input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  select:focus,textarea:focus,input:focus{outline:2px solid #ffd0a8;border-color:var(--orange)}

  .option-row{display:flex;align-items:flex-start;gap:10px;margin:10px 0}
  .option-row input[type=radio]{margin-top:14px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--green)}
  .option-row textarea{flex:1;min-height:44px}
  .option-label{flex:0 0 22px;padding-top:12px;font-weight:800;color:var(--muted)}

  .image-box{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbfd}
  .image-box img{max-width:100%;border-radius:8px;display:block;margin-bottom:10px;border:1px solid var(--line)}
  .image-actions{display:flex;gap:8px;flex-wrap:wrap}
  .no-image-note{font-size:13px;color:var(--muted);margin-bottom:10px}

  .option-image-box{margin:8px 0 0 32px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:#fafbfd}
  .option-image-box img{max-width:160px;border-radius:6px;display:block;margin-bottom:8px;border:1px solid var(--line)}
  .option-image-box .image-actions{display:flex;gap:6px;flex-wrap:wrap}
  .option-image-box button{font-size:11.5px;padding:6px 10px}

  .action-bar{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .save-note{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:16px}

  .footer-nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 5%;display:flex;justify-content:space-between;gap:10px}

  /* ===== Crop modal ===== */
  .modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:80}
  .modal.show{display:grid}
  .modal-dialog{background:#fff;border-radius:16px;padding:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto}
  .modal-dialog h2{margin:0 0 4px;font-size:17px}
  .modal-dialog p{margin:0 0 14px;color:var(--muted);font-size:13px}
  #cropCanvas{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:crosshair;touch-action:none;display:block}
  .crop-target-label{display:inline-block;background:#fff3e5;color:#a5720a;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800;margin-bottom:10px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
  .page-input-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .page-input-row input{width:80px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img src="../aspinora-logo.png" alt="Aspinora" class="brand-mark"><div class="brand-name">Aspi<span>nora</span></div></div>
    <div class="paper-title" id="paperTitle">Loading…</div>
    <div class="progress-pill" id="progressPill">0 / 0 reviewed</div>
    <button class="btn btn-ghost" onclick="window.location.href='dashboard.html'">Dashboard</button>
    <button class="btn btn-primary" id="publishBtn" disabled>Publish PYQ</button>
  </header>

  <div class="body">
    <nav class="nav" id="navPanel"><div style="color:#9aa3b2;font-size:13px">Loading questions…</div></nav>
    <main class="editor">
      <div class="editor-inner" id="editorInner">
        <div style="color:#9aa3b2;font-size:14px">Select a question to review.</div>
      </div>
      <div class="footer-nav" id="footerNav" style="display:none">
        <button class="btn btn-ghost" id="prevBtn">← Previous</button>
        <button class="btn btn-green" id="approveBtn">Approve Question →</button>
        <button class="btn btn-ghost" id="nextBtn">Next →</button>
      </div>
    </main>
  </div>
</div>

<!-- CROP MODAL -->
<div class="modal" id="cropModal">
  <div class="modal-dialog">
    <h2>Crop image from source PDF</h2>
    <div class="crop-target-label" id="cropTargetLabel">Question image</div>
    <p>Drag a rectangle around the diagram/figure (works with touch too), then crop &amp; upload.</p>
    <div class="page-input-row">
      <label style="font-size:12.5px;font-weight:700">Page:</label>
      <input type="number" id="pageJumpInput" min="1" value="1">
      <button class="btn btn-ghost" id="pageJumpBtn">Go</button>
      <span id="pageLoadStatus" style="font-size:12.5px;color:#9aa3b2"></span>
    </div>
    <canvas id="cropCanvas"></canvas>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="cropUploadBtn" disabled>Crop &amp; Upload</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const SUPABASE_URL = 'https://tcufgyrhkpzkeyiffnaw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rhTVneW41uHvEX6PRkl8qw_mZ8BgQ9n';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const params = new URLSearchParams(window.location.search);
  const paperId = params.get('paper_id');
  if (!paperId) document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Missing paper_id in URL.</p>';

  let paper = null;
  let currentUserId = null;
  let sections = [];      // [{id, name, order_index}]
  let questions = [];     // flat, in nav order, each with .options[], .images[]
  let currentIndex = 0;
  let pdfSignedUrl = null;
  let pdfDoc = null; // pdf.js document, lazy-loaded

  async function guard() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = '/auth'; return null; }
    const { data: isAdmin } = await supabaseClient.rpc('is_admin');
    if (!isAdmin) { await supabaseClient.auth.signOut(); window.location.href = '/auth'; return null; }
    currentUserId = session.user.id;
    return session;
  }

  async function loadAll() {
    const { data: paperRow, error: paperErr } = await supabaseClient.from('pyq_papers').select('*').eq('id', paperId).single();
    if (paperErr || !paperRow) { document.getElementById('editorInner').innerHTML = 'Paper not found.'; return; }
    paper = paperRow;
    document.getElementById('paperTitle').textContent = `${paper.exam_name} ${paper.year} — ${paper.tier} (${paper.exam_date}${paper.shift !== 'Single Shift' ? ' ' + paper.shift : ''})`;

    const { data: sectionRows } = await supabaseClient.from('pyq_sections').select('*').eq('paper_id', paperId).order('order_index');
    sections = sectionRows || [];

    const { data: questionRows } = await supabaseClient.from('pyq_questions').select('*').eq('paper_id', paperId).order('question_number');
    const { data: optionRows } = await supabaseClient.from('pyq_options').select('*').in('question_id', (questionRows||[]).map(q=>q.id).length ? (questionRows||[]).map(q=>q.id) : ['00000000-0000-0000-0000-000000000000']).order('option_index');
    const { data: imageRows } = await supabaseClient.from('pyq_question_images').select('*').in('question_id', (questionRows||[]).map(q=>q.id).length ? (questionRows||[]).map(q=>q.id) : ['00000000-0000-0000-0000-000000000000']);

    questions = (questionRows || []).map(q => ({
      ...q,
      options: (optionRows||[]).filter(o => o.question_id === q.id).sort((a,b)=>a.option_index-b.option_index),
      images: (imageRows||[]).filter(im => im.question_id === q.id),
    })).sort((a,b) => {
      const sa = sections.findIndex(s=>s.id===a.section_id), sb = sections.findIndex(s=>s.id===b.section_id);
      return sa !== sb ? sa - sb : a.question_number - b.question_number;
    });

    renderNav();
    updateProgress();
    if (questions.length) { currentIndex = questions.findIndex(q => q.review_status !== 'approved'); if (currentIndex < 0) currentIndex = 0; renderEditor(); }
  }

  function updateProgress() {
    const total = questions.length;
    const approved = questions.filter(q => q.review_status === 'approved').length;
    document.getElementById('progressPill').innerHTML = `<b>${approved}</b> / ${total} reviewed`;
    document.getElementById('publishBtn').disabled = !(total > 0 && approved === total) || paper.status === 'published';
    document.getElementById('publishBtn').textContent = paper && paper.status === 'published' ? 'Published ✓' : 'Publish PYQ';
  }

  function renderNav() {
    const navEl = document.getElementById('navPanel');
    navEl.innerHTML = '';
    // Precompute index once instead of calling questions.indexOf() per button
    // (that was an O(n) scan per question, compounding on large papers).
    const indexById = new Map(questions.map((q, i) => [q.id, i]));
    sections.forEach(sec => {
      const h = document.createElement('h3');
      h.textContent = sec.name;
      navEl.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'qgrid';
      questions.filter(q => q.section_id === sec.id).forEach(q => {
        const idx = indexById.get(q.id);
        const btn = document.createElement('button');
        let cls = q.review_status === 'approved' ? 'approved' : q.review_status === 'rejected' ? 'rejected' : (q.extraction_status === 'needs_review' ? 'needs_review' : 'pending');
        btn.className = `qnum ${cls}${idx === currentIndex ? ' current' : ''}`;
        btn.textContent = q.question_number;
        btn.addEventListener('click', () => { currentIndex = idx; renderEditor(); });
        grid.appendChild(btn);
      });
      navEl.appendChild(grid);
    });
  }

  function renderEditor() {
    const q = questions[currentIndex];
    const inner = document.getElementById('editorInner');
    document.getElementById('footerNav').style.display = questions.length ? 'flex' : 'none';
    if (!q) { inner.innerHTML = 'No questions extracted.'; return; }

    const confPct = q.confidence != null ? Math.round(q.confidence * 100) : null;
    const warn = q.extraction_warnings ? `<div class="warn-banner">⚠️ <div>${escapeHtml(q.extraction_warnings)}</div></div>` : '';

    inner.innerHTML = `
      ${warn}
      <div class="meta-row">
        <span class="meta-chip">Q${q.question_number}</span>
        <span class="meta-chip">Page ${q.source_page ?? '—'} of source PDF</span>
        ${confPct !== null ? `<span class="meta-chip ${confPct < 75 ? 'conf-low' : ''}">Confidence ${confPct}%</span>` : ''}
        <span class="meta-chip">Status: ${q.review_status}</span>
      </div>

      <label class="field-label">Section / Subject</label>
      <select id="fSection"></select>

      <label class="field-label">External Question ID (optional)</label>
      <input type="text" id="fExternalId" value="${escapeAttr(q.external_question_id || '')}">

      <label class="field-label">Question text</label>
      <textarea id="fQuestionText" rows="4">${escapeHtml(q.question_text || '')}</textarea>

      <label class="field-label">Options — select the correct one</label>
      <div id="optionsWrap"></div>

      <label class="field-label">Question image</label>
      <div class="image-box" id="imageBox"></div>

      <div class="action-bar">
        <button class="btn btn-primary" id="saveBtn">Save changes</button>
        ${q.review_status === 'approved'
          ? `<button class="btn btn-ghost" id="unapproveBtn">Un-approve</button>`
          : `<button class="btn btn-red" id="flagBtn">${q.review_status === 'rejected' ? 'Unflag' : 'Mark extraction incorrect'}</button>`}
      </div>
      <div class="save-note" id="saveNote"></div>
    `;

    const sectionSel = document.getElementById('fSection');
    sections.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id; opt.textContent = s.name;
      if (s.id === q.section_id) opt.selected = true;
      sectionSel.appendChild(opt);
    });

    const optionsWrap = document.getElementById('optionsWrap');
    [0,1,2,3].forEach(i => {
      const opt = q.options.find(o => o.option_index === i) || { option_text: '', option_image_url: null };
      const row = document.createElement('div');
      row.innerHTML = `
        <div class="option-row">
          <span class="option-label">${String.fromCharCode(65+i)}</span>
          <input type="radio" name="correctOpt" value="${i}" ${q.correct_option_index === i ? 'checked' : ''}>
          <textarea data-opt-idx="${i}" rows="1">${escapeHtml(opt.option_text || '')}</textarea>
        </div>
        <div class="option-image-box" id="optionImageBox${i}"></div>
      `;
      optionsWrap.appendChild(row);
      renderOptionImageBox(q, i, opt.option_image_url || null);
    });

    renderImageBox(q);

    document.getElementById('saveBtn').addEventListener('click', () => saveCurrent());
    const flagBtn = document.getElementById('flagBtn');
    if (flagBtn) flagBtn.addEventListener('click', () => toggleFlag());
    const unapproveBtn = document.getElementById('unapproveBtn');
    if (unapproveBtn) unapproveBtn.addEventListener('click', () => unapproveCurrent());
    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;

    renderNav();
  }

  function renderImageBox(q) {
    const box = document.getElementById('imageBox');
    if (q.images.length) {
      box.innerHTML = `
        <img src="${q.images[0].image_url}" alt="Question image">
        <div class="image-actions">
          <button class="btn btn-ghost" id="replaceImageBtn">Replace image</button>
          <button class="btn btn-red" id="deleteImageBtn">Delete image</button>
        </div>
      `;
      document.getElementById('replaceImageBtn').addEventListener('click', () => openCropModal({ type: 'question' }));
      document.getElementById('deleteImageBtn').addEventListener('click', () => deleteImage());
    } else {
      box.innerHTML = `
        <div class="no-image-note">${q.needs_image ? 'The extractor flagged this question as needing a diagram/figure image.' : 'No image attached. Add one if this question needs a diagram.'}</div>
        <div class="image-actions">
          <button class="btn btn-primary" id="addImageBtn">Add image from PDF page</button>
        </div>
      `;
      document.getElementById('addImageBtn').addEventListener('click', () => openCropModal({ type: 'question' }));
    }
  }

  function renderOptionImageBox(q, optIdx, imageUrl) {
    const box = document.getElementById(`optionImageBox${optIdx}`);
    if (!box) return;
    if (imageUrl) {
      box.innerHTML = `
        <img src="${imageUrl}" alt="Option ${String.fromCharCode(65+optIdx)} image">
        <div class="image-actions">
          <button class="btn btn-ghost" data-opt-replace="${optIdx}">Replace</button>
          <button class="btn btn-red" data-opt-delete="${optIdx}">Delete</button>
        </div>
      `;
      box.querySelector(`[data-opt-replace="${optIdx}"]`).addEventListener('click', () => openCropModal({ type: 'option', index: optIdx }));
      box.querySelector(`[data-opt-delete="${optIdx}"]`).addEventListener('click', () => deleteOptionImage(optIdx));
    } else {
      box.innerHTML = `
        <div class="image-actions">
          <button class="btn btn-ghost" data-opt-add="${optIdx}">+ Add image for option ${String.fromCharCode(65+optIdx)}</button>
        </div>
      `;
      box.querySelector(`[data-opt-add="${optIdx}"]`).addEventListener('click', () => openCropModal({ type: 'option', index: optIdx }));
    }
  }

  async function saveCurrent(reviewStatusOverride) {
    const q = questions[currentIndex];
    const noteEl = document.getElementById('saveNote');
    const sectionId = document.getElementById('fSection').value;
    const externalId = document.getElementById('fExternalId').value.trim() || null;
    const questionText = document.getElementById('fQuestionText').value;
    const correctRadio = document.querySelector('input[name=correctOpt]:checked');
    const correctIdx = correctRadio ? parseInt(correctRadio.value) : null;
    const optionTexts = [0,1,2,3].map(i => document.querySelector(`textarea[data-opt-idx="${i}"]`).value);

    const questionUpdate = {
      section_id: sectionId,
      external_question_id: externalId,
      question_text: questionText,
      correct_option_index: correctIdx,
    };
    if (reviewStatusOverride) questionUpdate.review_status = reviewStatusOverride;

    // Run the question update and the options upsert in PARALLEL (not
    // sequentially), and batch all 4 options into ONE upsert call instead
    // of up to 4 separate update/insert round trips. This is the fix for
    // approving feeling slow after many questions — it was making ~7+
    // sequential network round trips per click.
    let qResult, optResult;
    try {
      [qResult, optResult] = await Promise.all([
        supabaseClient.from('pyq_questions').update(questionUpdate).eq('id', q.id),
        supabaseClient.from('pyq_options').upsert(
          [0,1,2,3].map(i => ({ question_id: q.id, option_index: i, option_text: optionTexts[i] })),
          { onConflict: 'question_id,option_index' }
        ),
      ]);
    } catch (e) {
      noteEl.textContent = 'Network error while saving: ' + (e?.message || e);
      noteEl.style.color = 'var(--red)';
      return false;
    }

    if (qResult.error) { noteEl.textContent = 'Could not save: ' + qResult.error.message; noteEl.style.color = 'var(--red)'; return false; }
    if (optResult.error) { noteEl.textContent = 'Could not save options: ' + optResult.error.message; noteEl.style.color = 'var(--red)'; return false; }

    // reflect edits locally
    q.section_id = sectionId; q.external_question_id = externalId; q.question_text = questionText; q.correct_option_index = correctIdx;
    if (reviewStatusOverride) q.review_status = reviewStatusOverride;
    optionTexts.forEach((t,i) => { const o = q.options.find(o=>o.option_index===i); if (o) o.option_text = t; else q.options.push({option_index:i, option_text:t}); });

    // Audit log is fire-and-forget — it's just a trail, never worth
    // blocking the UI on.
    supabaseClient.from('pyq_review_log').insert({
      question_id: q.id, admin_id: currentUserId,
      action: reviewStatusOverride === 'approved' ? 'approved' : 'edited',
    });

    if (!reviewStatusOverride) { noteEl.textContent = 'Saved.'; noteEl.style.color = '#1c8f57'; }
    return true;
  }

  async function approveCurrent() {
    const approveBtn = document.getElementById('approveBtn');
    if (!approveBtn || approveBtn.disabled) return; // guards against double-click races
    approveBtn.disabled = true;
    approveBtn.textContent = 'Approving…';
    try {
      const ok = await saveCurrent('approved');
      if (ok) {
        updateProgress();
        if (currentIndex < questions.length - 1) currentIndex++;
        renderEditor();
      }
    } catch (e) {
      document.getElementById('saveNote').textContent = 'Unexpected error: ' + (e?.message || e);
    } finally {
      // approveBtn is a static element that persists across renders (it
      // lives outside the rebuilt editor panel), so it must be explicitly
      // re-enabled here — it will NOT reset itself.
      approveBtn.disabled = false;
      approveBtn.textContent = 'Approve Question →';
    }
  }

  async function unapproveCurrent() {
    const q = questions[currentIndex];
    const { error } = await supabaseClient.from('pyq_questions').update({ review_status: 'pending' }).eq('id', q.id);
    if (error) { document.getElementById('saveNote').textContent = 'Could not un-approve: ' + error.message; return; }
    q.review_status = 'pending';
    supabaseClient.from('pyq_review_log').insert({ question_id: q.id, admin_id: currentUserId, action: 'edited', notes: 'Un-approved' });
    updateProgress();
    renderEditor();
  }

  async function toggleFlag() {
    const q = questions[currentIndex];
    const newStatus = q.review_status === 'rejected' ? 'pending' : 'rejected';
    const { error } = await supabaseClient.from('pyq_questions').update({ review_status: newStatus }).eq('id', q.id);
    if (error) { document.getElementById('saveNote').textContent = 'Could not update: ' + error.message; return; }
    q.review_status = newStatus;
    supabaseClient.from('pyq_review_log').insert({ question_id: q.id, admin_id: currentUserId, action: newStatus === 'rejected' ? 'flagged' : 'edited', notes: newStatus === 'rejected' ? 'Marked extraction incorrect' : 'Unflagged' });
    updateProgress();
    renderEditor();
  }

  async function deleteImage() {
    const q = questions[currentIndex];
    if (!q.images.length) return;
    const img = q.images[0];
    await supabaseClient.from('pyq_question_images').delete().eq('id', img.id);
    q.images = [];
    renderImageBox(q);
  }

  async function deleteOptionImage(optIdx) {
    const q = questions[currentIndex];
    const opt = q.options.find(o => o.option_index === optIdx);
    if (!opt) return;
    const { error } = await supabaseClient.from('pyq_options').update({ option_image_url: null }).eq('id', opt.id);
    if (error) { alert('Could not remove image: ' + error.message); return; }
    opt.option_image_url = null;
    renderOptionImageBox(q, optIdx, null);
  }

  // ================= CROP MODAL =================
  const cropModal = document.getElementById('cropModal');
  const cropCanvas = document.getElementById('cropCanvas');
  const ctx = cropCanvas.getContext('2d');
  let dragStart = null, dragRect = null, currentPageImageData = null;
  let cropTarget = { type: 'question' }; // or { type: 'option', index: 0..3 }

  document.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', () => cropModal.classList.remove('show')));

  async function ensurePdfLoaded() {
    if (pdfDoc) return pdfDoc;
    const { data, error } = await supabaseClient.storage.from('pyq-source-pdfs').createSignedUrl(paper.source_pdf_path, 3600);
    if (error) throw new Error('Could not get PDF: ' + error.message);
    pdfSignedUrl = data.signedUrl;
    pdfDoc = await pdfjsLib.getDocument(pdfSignedUrl).promise;
    return pdfDoc;
  }

  async function openCropModal(target) {
    cropTarget = target || { type: 'question' };
    document.getElementById('cropTargetLabel').textContent =
      cropTarget.type === 'option' ? `Option ${String.fromCharCode(65 + cropTarget.index)} image` : 'Question image';
    const q = questions[currentIndex];
    document.getElementById('pageJumpInput').value = q.source_page || 1;
    cropModal.classList.add('show');
    document.getElementById('cropUploadBtn').disabled = true;
    dragRect = null;
    try {
      document.getElementById('pageLoadStatus').textContent = 'Loading PDF…';
      await ensurePdfLoaded();
      await renderPdfPage(q.source_page || 1);
    } catch (e) {
      document.getElementById('pageLoadStatus').textContent = e.message;
    }
  }

  document.getElementById('pageJumpBtn').addEventListener('click', async () => {
    const pageNum = parseInt(document.getElementById('pageJumpInput').value) || 1;
    document.getElementById('pageLoadStatus').textContent = 'Loading…';
    try { await renderPdfPage(pageNum); document.getElementById('pageLoadStatus').textContent = ''; }
    catch (e) { document.getElementById('pageLoadStatus').textContent = e.message; }
  });

  async function renderPdfPage(pageNum) {
    const doc = await ensurePdfLoaded();
    const page = await doc.getPage(Math.max(1, Math.min(pageNum, doc.numPages)));
    const viewport = page.getViewport({ scale: 1.5 });
    cropCanvas.width = viewport.width;
    cropCanvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    currentPageImageData = ctx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
    document.getElementById('pageLoadStatus').textContent = `Page ${pageNum} of ${doc.numPages}`;
    dragRect = null;
    document.getElementById('cropUploadBtn').disabled = true;
  }

  function canvasPos(e) {
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / rect.width, scaleY = cropCanvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  // Pointer Events unify mouse AND touch input (iPad included) into one API —
  // plain mousedown/mousemove/mouseup does not reliably fire for touch drags.
  cropCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    cropCanvas.setPointerCapture(e.pointerId);
    dragStart = canvasPos(e);
    dragRect = null;
  });
  cropCanvas.addEventListener('pointermove', (e) => {
    if (!dragStart) return;
    e.preventDefault();
    const p = canvasPos(e);
    dragRect = { x: Math.min(dragStart.x,p.x), y: Math.min(dragStart.y,p.y), w: Math.abs(p.x-dragStart.x), h: Math.abs(p.y-dragStart.y) };
    ctx.putImageData(currentPageImageData, 0, 0);
    ctx.strokeStyle = '#ff7800'; ctx.lineWidth = 2;
    ctx.strokeRect(dragRect.x, dragRect.y, dragRect.w, dragRect.h);
  });
  function endDrag(e) {
    if (!dragStart) return;
    dragStart = null;
    document.getElementById('cropUploadBtn').disabled = !(dragRect && dragRect.w > 5 && dragRect.h > 5);
  }
  cropCanvas.addEventListener('pointerup', endDrag);
  cropCanvas.addEventListener('pointercancel', endDrag);

  document.getElementById('cropUploadBtn').addEventListener('click', async () => {
    if (!dragRect) return;
    const btn = document.getElementById('cropUploadBtn');
    btn.disabled = true; btn.textContent = 'Uploading…';
    // The orange selection rectangle was drawn directly onto this canvas
    // as a drag guide — restore the clean, unmarked page render before
    // reading pixels, or the crop's edges pick up the orange stroke color.
    ctx.putImageData(currentPageImageData, 0, 0);
    const cropCanvasOut = document.createElement('canvas');
    cropCanvasOut.width = dragRect.w; cropCanvasOut.height = dragRect.h;
    cropCanvasOut.getContext('2d').putImageData(
      ctx.getImageData(dragRect.x, dragRect.y, dragRect.w, dragRect.h), 0, 0
    );
    const blob = await new Promise(res => cropCanvasOut.toBlob(res, 'image/png'));
    const q = questions[currentIndex];
    const suffix = cropTarget.type === 'option' ? `opt${cropTarget.index}` : 'question';
    const path = `${paperId}/${q.id}_${suffix}_${Date.now()}.png`;
    const { error: upErr } = await supabaseClient.storage.from('pyq-images').upload(path, blob, { contentType: 'image/png' });
    if (upErr) { alert('Upload failed: ' + upErr.message); btn.disabled = false; btn.textContent = 'Crop & Upload'; return; }
    const { data: pub } = supabaseClient.storage.from('pyq-images').getPublicUrl(path);
    const userId = currentUserId;

    if (cropTarget.type === 'option') {
      const opt = q.options.find(o => o.option_index === cropTarget.index);
      if (opt) {
        const { error } = await supabaseClient.from('pyq_options').update({ option_image_url: pub.publicUrl }).eq('id', opt.id);
        if (error) { alert('Could not save option image: ' + error.message); btn.disabled = false; btn.textContent = 'Crop & Upload'; return; }
        opt.option_image_url = pub.publicUrl;
      }
      await supabaseClient.from('pyq_review_log').insert({ question_id: q.id, admin_id: userId, action: 'image_replaced', notes: `Option ${String.fromCharCode(65+cropTarget.index)} image set` });
      btn.disabled = false; btn.textContent = 'Crop & Upload';
      cropModal.classList.remove('show');
      renderOptionImageBox(q, cropTarget.index, pub.publicUrl);
    } else {
      if (q.images.length) await supabaseClient.from('pyq_question_images').delete().eq('question_id', q.id);
      const { data: imgRow } = await supabaseClient.from('pyq_question_images').insert({ question_id: q.id, image_url: pub.publicUrl, page_number: parseInt(document.getElementById('pageJumpInput').value)||null }).select().single();
      q.images = imgRow ? [imgRow] : [];
      await supabaseClient.from('pyq_review_log').insert({ question_id: q.id, admin_id: userId, action: 'image_replaced' });
      btn.disabled = false; btn.textContent = 'Crop & Upload';
      cropModal.classList.remove('show');
      renderImageBox(q);
    }
  });

  document.getElementById('publishBtn').addEventListener('click', async () => {
  if (!confirm(
    'Publish this PYQ? It will immediately become visible to students in the mock test list. ' +
    'After successful publication, the original source PDF will be permanently deleted from Storage. ' +
    'The questions, options, images, and review data will be retained.'
  )) return;

  const btn = document.getElementById('publishBtn');

  btn.disabled = true;
  btn.textContent = 'Publishing…';

  try {
    const { data, error } = await supabaseClient.functions.invoke(
      'publish-pyq-paper-v2',
      {
        body: { paper_id: paperId }
      }
    );

    if (error) {
      throw new Error(error.message || 'Could not publish the PYQ.');
    }

    if (!data || data.success !== true || data.published !== true) {
      throw new Error(data?.error || 'Publication could not be verified.');
    }

    // The Edge Function has already verified publication and PDF cleanup.
    paper.status = 'published';
    paper.is_published = true;
    paper.source_pdf_path = null;

    updateProgress();

    if (data.warning) {
      alert(
        'PYQ published successfully.\n\n' +
        'Source PDF was deleted, but there was a metadata warning:\n\n' +
        data.warning
      );
    } else {
      alert(
        'Published successfully.\n\n' +
        'The PYQ is now available to students and the original source PDF has been permanently removed from Storage.'
      );
    }

  } catch (e) {
    console.error('Publish error:', e);

    // Do NOT mark the UI as published if the request failed.
    btn.disabled = false;
    btn.textContent = 'Publish PYQ';

    alert('Could not publish the PYQ:\n\n' + (e?.message || e));
  }
});

  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function escapeAttr(s) { return escapeHtml(s); }

  // These three buttons live in the static footer — NOT inside the
  // rebuilt editor panel — so they must be wired exactly ONCE. Wiring them
  // inside renderEditor() (which runs on every navigation/approve) was the
  // bug: it silently piled up an extra click listener on every render,
  // so one tap could fire many old handlers at once (the "jumps to a
  // random question" symptom), and approve's disabled state was never
  // reset because these nodes are never actually recreated.
  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentIndex > 0) { currentIndex--; renderEditor(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentIndex < questions.length - 1) { currentIndex++; renderEditor(); }
  });
  document.getElementById('approveBtn').addEventListener('click', () => approveCurrent());

  (async () => {
    const session = await guard();
    if (!session || !paperId) return;
    await loadAll();
  })();
</script>
</body>
</html>
