<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review PYQ — Aspinora Admin</title>
<style>
  :root{
    --orange:#ff7800;--orange-dark:#e85d00;--ink:#172033;--muted:#6d7585;
    --line:#edf0f5;--shadow:0 18px 55px rgba(34,45,72,.08);--red:#e5484d;--green:#3ecf7a;
    --blue:#367dd7;--purple:#7957db;--yellow:#fff200;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f9;color:var(--ink)}
  button{font:inherit;cursor:pointer}
  .app{height:100vh;display:flex;flex-direction:column}

  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .brand-mark{width:32px;height:32px;display:block}
  .brand-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
  .brand-name span{color:var(--orange)}
  .paper-title{flex:1;font-size:14.5px;font-weight:700;color:#394255;text-align:center}
  .progress-pill{flex:0 0 auto;background:#eef1f5;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:800;color:#394255}
  .progress-pill b{color:#1c8f57}
  .btn{border:0;border-radius:9px;padding:9px 15px;font-weight:750;font-size:13px}
  .btn-primary{background:var(--orange);color:#fff}
  .btn-primary:hover{background:var(--orange-dark)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#394255}
  .btn-ghost:hover{border-color:#ffd0a8;color:var(--orange-dark)}
  .btn-green{background:var(--green);color:#043}
  .btn-green:hover{filter:brightness(.95)}
  .btn-red{background:#ffe9e9;color:var(--red)}
  .btn-red:hover{background:#ffdada}

  .body{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr)}
  .nav{overflow:auto;border-right:1px solid var(--line);background:#fff;padding:16px}
  .nav h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
  .nav h3:first-child{margin-top:0}
  .qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .qnum{height:32px;border-radius:6px;border:0;font-size:12px;font-weight:700;display:grid;place-items:center;background:#eef1f5;color:#8b95a2}
  .qnum.pending{background:#dbe6ff;color:var(--blue)}
  .qnum.needs_review{background:#fff3d6;color:#a5720a}
  .qnum.approved{background:var(--green);color:#043}
  .qnum.rejected{background:#ffe0e0;color:var(--red)}
  .qnum.current{outline:2.5px solid var(--orange);outline-offset:1px}

  .editor{overflow:auto;padding:26px 5% 60px}
  .editor-inner{max-width:760px;margin:0 auto}
  .warn-banner{display:flex;gap:10px;align-items:flex-start;background:#fff3d6;border:1px solid #ffdf9e;color:#7a5300;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;line-height:1.5}
  .meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .meta-chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:700;color:#394255}
  .meta-chip.conf-low{border-color:#ffdf9e;background:#fff9ec;color:#a5720a}

  label.field-label{display:block;font-size:12px;font-weight:800;color:#394255;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.4px}
  select,textarea,input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  select:focus,textarea:focus,input:focus{outline:2px solid #ffd0a8;border-color:var(--orange)}

  .option-row{display:flex;align-items:flex-start;gap:10px;margin:10px 0}
  .option-row input[type=radio]{margin-top:14px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--green)}
  .option-row textarea{flex:1;min-height:44px}
  .option-label{flex:0 0 22px;padding-top:12px;font-weight:800;color:var(--muted)}

  .image-box{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafbfd}
  .image-box img{max-width:100%;border-radius:8px;display:block;margin-bottom:10px;border:1px solid var(--line)}
  .image-actions{display:flex;gap:8px;flex-wrap:wrap}
  .no-image-note{font-size:13px;color:var(--muted);margin-bottom:10px}

  .option-image-box{margin:8px 0 0 32px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:#fafbfd}
  .option-image-box img{max-width:160px;border-radius:6px;display:block;margin-bottom:8px;border:1px solid var(--line)}
  .option-image-box .image-actions{display:flex;gap:6px;flex-wrap:wrap}
  .option-image-box button{font-size:11.5px;padding:6px 10px}

  .action-bar{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .save-note{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:16px}

  .footer-nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 5%;display:flex;justify-content:space-between;gap:10px}

  /* ===== Crop modal ===== */
  .modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:80}
  .modal.show{display:grid}
  .modal-dialog{background:#fff;border-radius:16px;padding:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto}
  .modal-dialog h2{margin:0 0 4px;font-size:17px}
  .modal-dialog p{margin:0 0 14px;color:var(--muted);font-size:13px}
  #cropCanvas{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:crosshair;touch-action:none;display:block}
  .crop-target-label{display:inline-block;background:#fff3e5;color:#a5720a;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800;margin-bottom:10px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
  .page-input-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .page-input-row input{width:80px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="../aspinora-logo.png" alt="Aspinora" class="brand-mark">
      <div class="brand-name">Aspi<span>nora</span></div>
    </div>
    <div class="paper-title" id="paperTitle">Loading…</div>
    <div class="progress-pill" id="progressPill">0 / 0 reviewed</div>
    <button class="btn btn-ghost" onclick="window.location.href='dashboard.html'">Dashboard</button>
    <button class="btn btn-primary" id="publishBtn" disabled>Publish PYQ</button>
  </header>

  <div class="body">
    <nav class="nav" id="navPanel">
      <div style="color:#9aa3b2;font-size:13px">Loading questions…</div>
    </nav>

    <main class="editor">
      <div class="editor-inner" id="editorInner">
        <div style="color:#9aa3b2;font-size:14px">Select a question to review.</div>
      </div>

      <div class="footer-nav" id="footerNav" style="display:none">
        <button class="btn btn-ghost" id="prevBtn">← Previous</button>
        <button class="btn btn-green" id="approveBtn">Approve Question →</button>
        <button class="btn btn-ghost" id="nextBtn">Next →</button>
      </div>
    </main>
  </div>
</div>

<!-- CROP MODAL -->
<div class="modal" id="cropModal">
  <div class="modal-dialog">
    <h2>Crop image from source PDF</h2>
    <div class="crop-target-label" id="cropTargetLabel">Question image</div>
    <p>Drag a rectangle around the diagram/figure (works with touch too), then crop &amp; upload.</p>

    <div class="page-input-row">
      <label style="font-size:12.5px;font-weight:700">Page:</label>
      <input type="number" id="pageJumpInput" min="1" value="1">
      <button class="btn btn-ghost" id="pageJumpBtn">Go</button>
      <span id="pageLoadStatus" style="font-size:12.5px;color:#9aa3b2"></span>
    </div>

    <canvas id="cropCanvas"></canvas>

    <div class="modal-actions">
      <button class="btn btn-ghost" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="cropUploadBtn" disabled>Crop &amp; Upload</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const SUPABASE_URL = 'https://tcufgyrhkpzkeyiffnaw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_rhTVneW41uHvEX6PRkl8qw_mZ8BgQ9n';

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const params = new URLSearchParams(window.location.search);
  const paperId = params.get('paper_id');

  if (!paperId) {
    document.body.innerHTML =
      '<p style="padding:40px;font-family:sans-serif">Missing paper_id in URL.</p>';
  }

  let paper = null;
  let currentUserId = null;
  let sections = [];
  let questions = [];
  let currentIndex = 0;
  let pdfSignedUrl = null;
  let pdfDoc = null;

  /*
   * ============================================================
   * CANONICAL QUESTION ORDERING
   * ============================================================
   *
   * The Review page must NEVER derive question numbering or
   * ordering from array index / DOM position. The only correct
   * order is:
   *
   *   1. pyq_sections.order_index (the actual loaded section order)
   *   2. pyq_questions.question_number (numeric)
   *   3. pyq_questions.id (deterministic fallback tie-breaker)
   *
   * This function mutates the global `questions` array in place.
   */
  function sortQuestions() {
    const sectionOrder = new Map(
      sections.map((s, i) => [
        s.id,
        (s.order_index !== null && s.order_index !== undefined)
          ? s.order_index
          : i
      ])
    );

    questions.sort((a, b) => {
      const oa =
        sectionOrder.has(a.section_id)
          ? sectionOrder.get(a.section_id)
          : Number.MAX_SAFE_INTEGER;

      const ob =
        sectionOrder.has(b.section_id)
          ? sectionOrder.get(b.section_id)
          : Number.MAX_SAFE_INTEGER;

      if (oa !== ob) {
        return oa - ob;
      }

      const na = Number(a.question_number);
      const nb = Number(b.question_number);

      const naValid = !isNaN(na);
      const nbValid = !isNaN(nb);

      if (naValid && nbValid && na !== nb) {
        return na - nb;
      }

      if (naValid && !nbValid) {
        return -1;
      }

      if (!naValid && nbValid) {
        return 1;
      }

      // Deterministic fallback tie-breaker: never array index.
      return String(a.id).localeCompare(String(b.id));
    });
  }

  /*
   * ============================================================
   * OPTION INDEX NORMALIZATION
   * ============================================================
   *
   * Legacy extracted rows may store option_index using either:
   *   - canonical convention: 0,1,2,3  (A,B,C,D)
   *   - legacy convention:    1,2,3,4  (A,B,C,D)
   *
   * The UI's internal representation must ALWAYS be 0-3. This
   * shift is derived per-question from the actual set of indexes
   * present for that question, never assumed globally.
   */
  function normalizeOptionIndex(rawIndex, shift) {
    return rawIndex + shift;
  }

  function normalizeQuestionOptions(q, rawOptions) {
    const indices =
      rawOptions
        .map(o => o.option_index)
        .filter(v => v !== null && v !== undefined && !isNaN(v));

    let shift = 0;

    if (indices.length) {
      const min = Math.min(...indices);
      const max = Math.max(...indices);

      // Clear evidence of legacy 1-4 convention: shift down by 1.
      // If there is already a 0 present, or values fall outside
      // 1-4, treat as canonical / leave untouched rather than
      // guessing.
      if (min === 1 && max <= 4) {
        shift = -1;
      }
    }

    const options =
      rawOptions
        .map(o => ({
          ...o,
          option_index:
            normalizeOptionIndex(o.option_index, shift)
        }))
        .filter(o => o.option_index >= 0 && o.option_index <= 3)
        .sort((a, b) => a.option_index - b.option_index);

    let correctIndex = q.correct_option_index;

    if (correctIndex !== null && correctIndex !== undefined) {
      correctIndex = normalizeOptionIndex(correctIndex, shift);
    }

    return { options, correctIndex };
  }

  /*
   * ============================================================
   * SECTION / NUMBERING VALIDATION
   * ============================================================
   *
   * Detects malformed extraction structure (wrong counts,
   * duplicate numbers, missing numbers, non-numeric or
   * out-of-range numbers) WITHOUT ever attempting to silently
   * repair it by renumbering. The Review UI only surfaces a
   * warning so the underlying extraction/database can be fixed.
   */
  function validateSections() {
    const EXPECTED_PER_SECTION = 25;
    const warnings = [];

    sections.forEach(sec => {
      const secQuestions =
        questions.filter(q => q.section_id === sec.id);

      const count = secQuestions.length;

      const numbers =
        secQuestions.map(q => q.question_number);

      const nonNumeric =
        secQuestions.filter(q => {
          const n = Number(q.question_number);
          return q.question_number === null ||
            q.question_number === undefined ||
            isNaN(n);
        });

      const outOfRange =
        secQuestions.filter(q => {
          const n = Number(q.question_number);
          return !isNaN(n) && (n < 1 || n > EXPECTED_PER_SECTION);
        });

      const seenCounts = new Map();

      numbers.forEach(n => {
        const key = String(n);
        seenCounts.set(key, (seenCounts.get(key) || 0) + 1);
      });

      const duplicates = [];

      seenCounts.forEach((c, key) => {
        if (c > 1) {
          duplicates.push(key);
        }
      });

      const missing = [];

      if (count !== EXPECTED_PER_SECTION) {
        for (let i = 1; i <= EXPECTED_PER_SECTION; i++) {
          if (!numbers.some(n => Number(n) === i)) {
            missing.push(i);
          }
        }
      }

      const isMalformed =
        count !== EXPECTED_PER_SECTION ||
        duplicates.length > 0 ||
        nonNumeric.length > 0 ||
        outOfRange.length > 0;

      if (isMalformed) {
        const parts = [];

        parts.push(
          `expected ${EXPECTED_PER_SECTION}, found ${count}`
        );

        if (duplicates.length) {
          parts.push(
            `duplicate number(s): ${duplicates.join(', ')}`
          );
        }

        if (missing.length) {
          parts.push(
            `missing number(s): ${missing.join(', ')}`
          );
        }

        if (nonNumeric.length) {
          parts.push(
            `${nonNumeric.length} non-numeric question_number value(s)`
          );
        }

        if (outOfRange.length) {
          parts.push(
            `${outOfRange.length} question_number value(s) outside 1-${EXPECTED_PER_SECTION}`
          );
        }

        warnings.push({
          sectionId: sec.id,
          sectionName: sec.name,
          text: `${sec.name}: ${parts.join('; ')}`
        });
      }
    });

    return warnings;
  }

  async function guard() {
    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = '/auth';
      return null;
    }

    const { data: isAdmin } =
      await supabaseClient.rpc('is_admin');

    if (!isAdmin) {
      await supabaseClient.auth.signOut();
      window.location.href = '/auth';
      return null;
    }

    currentUserId = session.user.id;
    return session;
  }

  async function loadAll() {
    const {
      data: paperRow,
      error: paperErr
    } = await supabaseClient
      .from('pyq_papers')
      .select('*')
      .eq('id', paperId)
      .single();

    if (paperErr || !paperRow) {
      document.getElementById('editorInner').innerHTML =
        'Paper not found.';
      return;
    }

    paper = paperRow;

    document.getElementById('paperTitle').textContent =
      `${paper.exam_name} ${paper.year} — ${paper.tier} (${paper.exam_date}${paper.shift !== 'Single Shift' ? ' ' + paper.shift : ''})`;

    const { data: sectionRows } =
      await supabaseClient
        .from('pyq_sections')
        .select('*')
        .eq('paper_id', paperId)
        .order('order_index');

    sections = sectionRows || [];

    const {
      data: questionRows
    } = await supabaseClient
      .from('pyq_questions')
      .select('*')
      .eq('paper_id', paperId);

    const questionIds =
      (questionRows || []).map(q => q.id);

    const {
      data: optionRows
    } = await supabaseClient
      .from('pyq_options')
      .select('*')
      .in(
        'question_id',
        questionIds.length
          ? questionIds
          : ['00000000-0000-0000-0000-000000000000']
      )
      .order('option_index');

    const {
      data: imageRows
    } = await supabaseClient
      .from('pyq_question_images')
      .select('*')
      .in(
        'question_id',
        questionIds.length
          ? questionIds
          : ['00000000-0000-0000-0000-000000000000']
      );

    questions =
      (questionRows || [])
        .map(q => {
          const rawOpts =
            (optionRows || [])
              .filter(o => o.question_id === q.id);

          const {
            options,
            correctIndex
          } = normalizeQuestionOptions(
            q,
            rawOpts
          );

          return {
            ...q,
            correct_option_index: correctIndex,
            options,
            images:
              (imageRows || [])
                .filter(im => im.question_id === q.id)
          };
        });

    sortQuestions();

    renderNav();
    updateProgress();

    if (questions.length) {
      currentIndex =
        questions.findIndex(
          q => q.review_status !== 'approved'
        );

      if (currentIndex < 0) {
        currentIndex = 0;
      }

      renderEditor();
    }
  }

  function updateProgress() {
    const total = questions.length;

    const approved =
      questions.filter(
        q => q.review_status === 'approved'
      ).length;

    document.getElementById('progressPill').innerHTML =
      `<b>${approved}</b> / ${total} reviewed`;

    document.getElementById('publishBtn').disabled =
      !(total > 0 && approved === total) ||
      paper.status === 'published';

    document.getElementById('publishBtn').textContent =
      paper && paper.status === 'published'
        ? 'Published ✓'
        : 'Publish PYQ';
  }

  function renderNav() {
    const navEl =
      document.getElementById('navPanel');

    navEl.innerHTML = '';

    const structureWarnings =
      validateSections();

    if (structureWarnings.length) {
      const banner =
        document.createElement('div');

      banner.className = 'warn-banner';
      banner.style.marginBottom = '14px';

      banner.innerHTML =
        '⚠️ <div>Section/numbering issue detected — this needs correction upstream, it has not been auto-fixed:<br>' +
        structureWarnings
          .map(w => escapeHtml(w.text))
          .join('<br>') +
        '</div>';

      navEl.appendChild(banner);
    }

    const indexById =
      new Map(
        questions.map((q, i) => [q.id, i])
      );

    sections.forEach(sec => {
      const h =
        document.createElement('h3');

      h.textContent = sec.name;

      navEl.appendChild(h);

      const grid =
        document.createElement('div');

      grid.className = 'qgrid';

      questions
        .filter(q => q.section_id === sec.id)
        .forEach(q => {
          const idx =
            indexById.get(q.id);

          const btn =
            document.createElement('button');

          let cls =
            q.review_status === 'approved'
              ? 'approved'
              : q.review_status === 'rejected'
                ? 'rejected'
                : (
                    q.extraction_status === 'needs_review'
                      ? 'needs_review'
                      : 'pending'
                  );

          btn.className =
            `qnum ${cls}${idx === currentIndex ? ' current' : ''}`;

          btn.textContent =
            q.question_number;

          btn.addEventListener(
            'click',
            () => {
              currentIndex = idx;
              renderEditor();
            }
          );

          grid.appendChild(btn);
        });

      navEl.appendChild(grid);
    });
  }

  function renderEditor() {
    const q =
      questions[currentIndex];

    const inner =
      document.getElementById('editorInner');

    document.getElementById('footerNav').style.display =
      questions.length ? 'flex' : 'none';

    if (!q) {
      inner.innerHTML =
        'No questions extracted.';
      return;
    }

    const confPct =
      q.confidence != null
        ? Math.round(q.confidence * 100)
        : null;

    const warn =
      q.extraction_warnings
        ? `<div class="warn-banner">⚠️ <div>${escapeHtml(q.extraction_warnings)}</div></div>`
        : '';

    inner.innerHTML = `
      ${warn}

      <div class="meta-row">
        <span class="meta-chip">
          Q${q.question_number}
        </span>

        <span class="meta-chip">
          Page ${q.source_page ?? '—'} of source PDF
        </span>

        ${
          confPct !== null
            ? `<span class="meta-chip ${confPct < 75 ? 'conf-low' : ''}">
                Confidence ${confPct}%
              </span>`
            : ''
        }

        <span class="meta-chip">
          Status: ${q.review_status}
        </span>
      </div>

      <label class="field-label">
        Section / Subject
      </label>

      <select id="fSection"></select>

      <label class="field-label">
        External Question ID (optional)
      </label>

      <input
        type="text"
        id="fExternalId"
        value="${escapeAttr(q.external_question_id || '')}"
      >

      <label class="field-label">
        Question text
      </label>

      <textarea
        id="fQuestionText"
        rows="4"
      >${escapeHtml(q.question_text || '')}</textarea>

      <label class="field-label">
        Options — select the correct one
      </label>

      <div id="optionsWrap"></div>

      <label class="field-label">
        Question image
      </label>

      <div class="image-box" id="imageBox"></div>

      <div class="action-bar">
        <button
          class="btn btn-primary"
          id="saveBtn"
        >
          Save changes
        </button>

        ${
          q.review_status === 'approved'
            ? `
              <button
                class="btn btn-ghost"
                id="unapproveBtn"
              >
                Un-approve
              </button>
            `
            : `
              <button
                class="btn btn-red"
                id="flagBtn"
              >
                ${
                  q.review_status === 'rejected'
                    ? 'Unflag'
                    : 'Mark extraction incorrect'
                }
              </button>
            `
        }
      </div>

      <div
        class="save-note"
        id="saveNote"
      ></div>
    `;

    const sectionSel =
      document.getElementById('fSection');

    sections.forEach(s => {
      const opt =
        document.createElement('option');

      opt.value = s.id;
      opt.textContent = s.name;

      if (s.id === q.section_id) {
        opt.selected = true;
      }

      sectionSel.appendChild(opt);
    });

    const optionsWrap =
      document.getElementById('optionsWrap');

    [0, 1, 2, 3].forEach(i => {
      const opt =
        q.options.find(
          o => o.option_index === i
        ) || {
          option_text: '',
          option_image_url: null

      const row =
        document.createElement('div');

      row.innerHTML = `

  function optionTextsChanged(
    currentOptions,
    incomingTexts
  ) {
    for (let i = 0; i < 4; i++) {
      const cur =
        (
          currentOptions.find(
            o => o.option_index === i
          ) || {}
        ).option_text || '';

      if (cur !== (incomingTexts[i] || '')) {
        return true;
      }
    }

    return false;
  }

  async function saveCurrent(
    reviewStatusOverride
  ) {
    const q =
      questions[currentIndex];

    const noteEl =
      document.getElementById('saveNote');

    const sectionId =
      document.getElementById('fSection').value;

    const externalId =
      document
        .getElementById('fExternalId')
        .value
        .trim() || null;

    const questionText =
      document.getElementById(
        'fQuestionText'
      ).value;

    const correctRadio =
      document.querySelector(
        'input[name=correctOpt]:checked'
      );

    const correctIdx =
      correctRadio
        ? parseInt(correctRadio.value)
        : null;

    const optionTexts =
      [0, 1, 2, 3].map(
        i =>
          document.querySelector(
            `textarea[data-opt-idx="${i}"]`
          ).value
      );

    /*
     * Determine whether this is a *material* edit. Section change
     * MUST always count as material (per spec). If the question
     * was previously approved and this is a material edit that is
     * not itself an explicit approval action, the approval must be
     * invalidated (review_status -> pending) rather than silently
     * left as approved.
     */
    const wasApproved =
      q.review_status === 'approved';

    const sectionChanged =
      sectionId !== q.section_id;

    const materialChange =
      sectionChanged ||
      externalId !== (q.external_question_id || null) ||
      questionText !== (q.question_text || '') ||
      correctIdx !== q.correct_option_index ||
      optionTextsChanged(q.options, optionTexts);

    let newStatus = q.review_status;

    if (reviewStatusOverride) {
      newStatus = reviewStatusOverride;
    } else if (wasApproved && materialChange) {
      newStatus = 'pending';
    }

    const autoUnapproved =
      !reviewStatusOverride &&
      wasApproved &&
      newStatus === 'pending';

    const questionUpdate = {
      section_id: sectionId,
      external_question_id: externalId,
      question_text: questionText,
      correct_option_index: correctIdx,
      review_status: newStatus
    };

    let qResult;
    let optResult;

    try {
      [
        qResult,
        optResult
      ] = await Promise.all([
        supabaseClient
          .from('pyq_questions')
          .update(questionUpdate)
          .eq('id', q.id),

        supabaseClient
          .from('pyq_options')
          .upsert(
            [0, 1, 2, 3].map(i => ({
              question_id: q.id,
              option_index: i,
              option_text: optionTexts[i]
            })),
            {
              onConflict:
                'question_id,option_index'
            }
          )
      ]);
    } catch (e) {
      noteEl.textContent =
        'Network error while saving: ' +
        (e?.message || e);

      noteEl.style.color =
        'var(--red)';

      return false;
    }

    if (qResult.error) {
      noteEl.textContent =
        'Could not save: ' +
        qResult.error.message;

      noteEl.style.color =
        'var(--red)';

      return false;
    }

    if (optResult.error) {
      noteEl.textContent =
        'Could not save options: ' +
        optResult.error.message;

      noteEl.style.color =
        'var(--red)';

      return false;
    }

    q.section_id = sectionId;
    q.external_question_id = externalId;
    q.question_text = questionText;
    q.correct_option_index = correctIdx;
    q.review_status = newStatus;

    optionTexts.forEach((t, i) => {
      const o =
        q.options.find(
          o => o.option_index === i
        );

      if (o) {
        o.option_text = t;
      } else {
        q.options.push({
          option_index: i,
          option_text: t
        });
      }
    });

    const logEntry = {
      question_id: q.id,
      admin_id: currentUserId,
      action:
        reviewStatusOverride === 'approved'
          ? 'approved'
          : 'edited'
    };

    if (autoUnapproved) {
      logEntry.notes =
        'Approval invalidated automatically: question was materially edited after approval';
    }

    supabaseClient
      .from('pyq_review_log')
      .insert(logEntry);

    /*
     * Question identity (q.id) is preserved through re-sorting.
     * The global array index is NEVER treated as identity.
     */
    if (sectionChanged) {
      sortQuestions();

      const newIdx =
        questions.findIndex(
          x => x.id === q.id
        );

      if (newIdx !== -1) {
        currentIndex = newIdx;
      }
    }

    updateProgress();

    if (!reviewStatusOverride) {
      renderNav();

      if (sectionChanged) {
        renderEditor();
      }

      const freshNote =
        document.getElementById('saveNote');

      if (freshNote) {
        freshNote.textContent =
          autoUnapproved
            ? 'Saved. Approval was removed because this question was edited — approve again if it is correct.'
            : 'Saved.';

        freshNote.style.color =
          autoUnapproved
            ? '#a5720a'
            : '#1c8f57';
      }
    }

    return true;
  }

  async function approveCurrent() {
    const approveBtn =
      document.getElementById(
        'approveBtn'
      );

    if (
      !approveBtn ||
      approveBtn.disabled
    ) {
      return;
    }

    approveBtn.disabled = true;
    approveBtn.textContent =
      'Approving…';

    try {
      const ok =
        await saveCurrent('approved');

      if (ok) {
        updateProgress();

        if (
          currentIndex <
          questions.length - 1
        ) {
          currentIndex++;
        }

        renderEditor();
      }

    } catch (e) {
      document.getElementById(
        'saveNote'
      ).textContent =
        'Unexpected error: ' +
        (e?.message || e);

    } finally {
      approveBtn.disabled = false;
      approveBtn.textContent =
        'Approve Question →';
    }
  }

  async function unapproveCurrent() {
    const q =
      questions[currentIndex];

    const { error } =
      await supabaseClient
        .from('pyq_questions')
        .update({
          review_status: 'pending'
        })
        .eq('id', q.id);

    if (error) {
      document.getElementById(
        'saveNote'
      ).textContent =
        'Could not un-approve: ' +
        error.message;

      return;
    }

    q.review_status = 'pending';

    supabaseClient
      .from('pyq_review_log')
      .insert({
        question_id: q.id,
        admin_id: currentUserId,
        action: 'edited',
        notes: 'Un-approved'
      });

    updateProgress();
    renderEditor();
  }

  async function toggleFlag() {
    const q =
      questions[currentIndex];

    const newStatus =
      q.review_status === 'rejected'
        ? 'pending'
        : 'rejected';

    const { error } =
      await supabaseClient
        .from('pyq_questions')
        .update({
          review_status: newStatus
        })
        .eq('id', q.id);

    if (error) {
      document.getElementById(
        'saveNote'
      ).textContent =
        'Could not update: ' +
        error.message;

      return;
    }

    q.review_status =
      newStatus;

    supabaseClient
      .from('pyq_review_log')
      .insert({
        question_id: q.id,
        admin_id: currentUserId,
        action:
          newStatus === 'rejected'
            ? 'flagged'
            : 'edited',
        notes:
          newStatus === 'rejected'
            ? 'Marked extraction incorrect'
            : 'Unflagged'
      });

    updateProgress();
    renderEditor();
  }

  /*
   * ============================================================
   * DELETE QUESTION IMAGE
   * ============================================================
   *
   * Removes:
   *   1. pyq_question_images database record
   *   2. Corresponding pyq-images Storage object
   *   3. Verifies that the Storage object is gone
   *
   * The database reference is removed first so the database never
   * points to an image that has already been deleted from Storage.
   */
  async function deleteImage() {
    const q =
      questions[currentIndex];

    if (
      !q ||
      !q.images ||
      !q.images.length
    ) {
      return;
    }

    const img =
      q.images[0];

    const storageMarker =
      '/storage/v1/object/public/pyq-images/';

    try {
      if (!img.image_url) {
        throw new Error(
          'This image has no Storage URL.'
        );
      }

      const markerIndex =
        img.image_url.indexOf(
          storageMarker
        );

      if (markerIndex === -1) {
        throw new Error(
          'Could not determine the pyq-images Storage path from this image URL.'
        );
      }

      const storagePath =
        decodeURIComponent(
          img.image_url.substring(
            markerIndex +
            storageMarker.length
          )
        );

      /*
       * STEP 1:
       * Delete the database reference.
       */
      const {
        error: dbError
      } =
        await supabaseClient
          .from('pyq_question_images')
          .delete()
          .eq('id', img.id);

      if (dbError) {
        throw new Error(
          'Could not remove the question image database record: ' +
          dbError.message
        );
      }

      /*
       * Update local UI immediately after the DB deletion succeeds.
       */
      q.images = [];
      renderImageBox(q);

      /*
       * STEP 2:
       * Delete the actual Storage object.
       */
      const {
        error: storageError
      } =
        await supabaseClient
          .storage
          .from('pyq-images')
          .remove([storagePath]);

      if (storageError) {
        throw new Error(
          'The database reference was removed, but the Storage file may remain as an orphan: ' +
          storageError.message
        );
      }

      /*
       * STEP 3:
       * Verify that the Storage object is really gone.
       */
      const pathParts =
        storagePath.split('/');

      const fileName =
        pathParts.pop();

      const folderPath =
        pathParts.join('/');

      const {
        data: remainingFiles,
        error: verifyError
      } =
        await supabaseClient
          .storage
          .from('pyq-images')
          .list(
            folderPath,
            {
              search: fileName,
              limit: 100
            }
          );

      if (verifyError) {
        throw new Error(
          'The database reference was removed and Storage deletion was requested, but verification failed. The Storage file may remain as an orphan: ' +
          verifyError.message
        );
      }

      if (
        (remainingFiles || [])
          .some(
            file =>
              file.name === fileName
          )
      ) {
        throw new Error(
          'The database reference was removed, but the Storage file still exists and may remain as an orphan.'
        );
      }

      /*
       * STEP 4:
       * Audit log.
       */
      const {
        error: logError
      } =
        await supabaseClient
          .from('pyq_review_log')
          .insert({
            question_id: q.id,
            admin_id: currentUserId,
            action: 'image_deleted'
          });

      if (logError) {
        console.error(
          'Review log insert failed:',
          logError.message
        );
      }

    } catch (error) {
      console.error(
        'Question image deletion failed:',
        error
      );

      alert(
        'Could not completely delete the question image:\n\n' +
        (error?.message || error)
      );
    }
  }

  /*
   * ============================================================
   * DELETE OPTION IMAGE

      if (storageError) {

        );

      /*

      const pathParts =

  async function renderPdfPage(
    pageNum
  ) {
    const doc =
      await ensurePdfLoaded();

    const page =
      await doc.getPage(
        Math.max(
          1,
          Math.min(
            pageNum,
            doc.numPages
          )
        )
      );

    const viewport =
      page.getViewport({
        scale: 1.5
      });

    cropCanvas.width =
      viewport.width;

    cropCanvas.height =
      viewport.height;

    await page.render({
      canvasContext: ctx,
      viewport
    }).promise;

    currentPageImageData =
      ctx.getImageData(
        0,
        0,
        cropCanvas.width,
        cropCanvas.height
      );

    document.getElementById(
      'pageLoadStatus'
    ).textContent =
      `Page ${pageNum} of ${doc.numPages}`;

    dragRect = null;

    document.getElementById(
      'cropUploadBtn'
    ).disabled = true;
  }

  function canvasPos(e) {
    const rect =
      cropCanvas.getBoundingClientRect();

    const scaleX =
      cropCanvas.width /
      rect.width;

    const scaleY =
      cropCanvas.height /
      rect.height;

    return {
      x:
        (e.clientX - rect.left) *
        scaleX,

      y:
        (e.clientY - rect.top) *
        scaleY
    };
  }

  cropCanvas.addEventListener(
    'pointerdown',
    e => {
      e.preventDefault();

      cropCanvas.setPointerCapture(
        e.pointerId
      );

      dragStart =
        canvasPos(e);

      dragRect = null;
    }
  );

  cropCanvas.addEventListener(
    'pointermove',
    e => {
      if (!dragStart) {
        return;
      }

      e.preventDefault();

      const p =
        canvasPos(e);

      dragRect = {
        x:
          Math.min(
            dragStart.x,
            p.x
          ),

        y:
          Math.min(
            dragStart.y,
            p.y
          ),

        w:
          Math.abs(
            p.x -
            dragStart.x
          ),

        h:
          Math.abs(
            p.y -
            dragStart.y
          )
      };

      ctx.putImageData(
        currentPageImageData,
        0,
        0
      );

      ctx.strokeStyle =
        '#ff7800';

      ctx.lineWidth = 2;

      ctx.strokeRect(
        dragRect.x,
        dragRect.y,
        dragRect.w,
        dragRect.h
      );
    }
  );

  function endDrag(e) {
    if (!dragStart) {
      return;
    }

    dragStart = null;

    document.getElementById(
      'cropUploadBtn'
    ).disabled =
      !(
        dragRect &&
        dragRect.w > 5 &&
        dragRect.h > 5
      );
  }

  cropCanvas.addEventListener(
    'pointerup',
    endDrag
  );

  cropCanvas.addEventListener(
    'pointercancel',
    endDrag
  );

  document.getElementById(
    'cropUploadBtn'
  ).addEventListener(
    'click',
    async () => {
      if (!dragRect) {
        return;
      }

      const btn =
        document.getElementById(
          'cropUploadBtn'
        );

      btn.disabled = true;
      btn.textContent =
        'Uploading…';

      try {
        /*
         * Restore clean PDF image.
         */
        ctx.putImageData(
          currentPageImageData,
          0,
          0
        );

        const cropCanvasOut =
          document.createElement(
            'canvas'
          );

        cropCanvasOut.width =
          Math.round(
            dragRect.w
          );

        cropCanvasOut.height =
          Math.round(
            dragRect.h
          );

        cropCanvasOut
          .getContext('2d')
          .putImageData(
            ctx.getImageData(
              Math.round(
                dragRect.x
              ),
              Math.round(
                dragRect.y
              ),
              Math.round(
                dragRect.w
              ),
              Math.round(
                dragRect.h
              )
            ),
            0,
            0
          );

        const blob =
          await new Promise(
            (resolve, reject) => {
              cropCanvasOut.toBlob(
                result =>
                  result
                    ? resolve(result)
                    : reject(
                        new Error(
                          'Could not create image'
                        )
                      ),
                'image/png'
              );
            }
          );

        const q =
          questions[currentIndex];

        const suffix =
          cropTarget.type === 'option'
            ? `opt${cropTarget.index}`
            : 'question';

        const newPath =
          `${paperId}/${q.id}_${suffix}_${Date.now()}.png`;

        /*
         * ========================================================
         * 1. UPLOAD NEW IMAGE FIRST
         * ========================================================
         */
        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from('pyq-images')
            .upload(
              newPath,
              blob,
              {
                contentType:
                  'image/png',
                upsert: false
              }
            );

        if (uploadError) {
          throw new Error(
            'Upload failed: ' +
            uploadError.message
          );
        }

        const {
          data: publicData
        } =
          supabaseClient
            .storage
            .from('pyq-images')
            .getPublicUrl(
              newPath
            );

        const newPublicUrl =
          publicData.publicUrl;

        /*
         * Convert public Storage URL back to path.
         */
        function storagePathFromPublicUrl(
          url
        ) {
          if (!url) {
            return null;
          }

          const marker =
            '/storage/v1/object/public/pyq-images/';

          const index =
            url.indexOf(marker);

          if (index === -1) {
            return null;
          }

          return decodeURIComponent(
            url.substring(
              index +
              marker.length
            )
          );
        }

        /*
         * Delete and verify old Storage object.
         */
        async function deleteOldStorageFile(
          oldUrl
        ) {
          const oldPath =
            storagePathFromPublicUrl(
              oldUrl
            );

          if (!oldPath) {
            console.warn(
              'Could not determine old Storage path from URL:',
              oldUrl
            );

            return false;
          }

          const {
            error: deleteError
          } =
            await supabaseClient
              .storage
              .from('pyq-images')
              .remove([
                oldPath
              ]);

          if (deleteError) {
            throw new Error(
              'New image was saved, but old image could not be deleted: ' +
              deleteError.message
            );
          }

          const parts =
            oldPath.split('/');

          const oldFileName =
            parts.pop();

          const oldFolder =
            parts.join('/');

          const {
            data: remaining,
            error: verifyError
          } =
            await supabaseClient
              .storage
              .from('pyq-images')
              .list(
                oldFolder,
                {
                  search:
                    oldFileName,
                  limit: 100
                }
              );

          if (verifyError) {
            throw new Error(
              'New image was saved and old image was requested for deletion, but deletion could not be verified: ' +
              verifyError.message
            );
          }

          const stillExists =
            (remaining || [])
              .some(
                item =>
                  item.name ===
                  oldFileName
              );

          if (stillExists) {
            throw new Error(
              'New image was saved, but the old image still exists in Storage.'
            );
          }

          return true;
        }

        /*
         * ========================================================
         * OPTION IMAGE
         * ========================================================
         */
        if (
          cropTarget.type ===
          'option'
        ) {
          const opt =
            q.options.find(
              o =>
                o.option_index ===
                cropTarget.index
            );

          if (!opt) {
            throw new Error(
              'Could not find the selected option.'
            );
          }

          const oldImageUrl =
            opt.option_image_url ||
            null;

          /*
           * Update DB with new image.
           */
          const {
            error: dbError
          } =
            await supabaseClient
              .from('pyq_options')
              .update({
                option_image_url:
                  newPublicUrl
              })
              .eq(
                'id',
                opt.id
              );

          if (dbError) {
            /*
             * New file was uploaded but DB update failed.
             * Clean up new Storage file.
             */
            await supabaseClient
              .storage
              .from('pyq-images')
              .remove([
                newPath
              ])
              .catch(
                () => {}
              );

            throw new Error(
              'Could not save option image: ' +
              dbError.message
            );
          }

          opt.option_image_url =
            newPublicUrl;

          /*
           * Delete old image.
           */
          if (
            oldImageUrl &&
            oldImageUrl !==
              newPublicUrl
          ) {
            await deleteOldStorageFile(
              oldImageUrl
            );
          }

          /*
           * Audit log.
           */
          await supabaseClient
            .from('pyq_review_log')
            .insert({
              question_id: q.id,
              admin_id:
                currentUserId,
              action:
                'image_replaced',
              notes:
                `Option ${String.fromCharCode(
                  65 +
                  cropTarget.index
                )} image replaced`
            });

          btn.disabled = false;

          btn.textContent =
            'Crop & Upload';

          cropModal.classList.remove(
            'show'
          );

          renderOptionImageBox(
            q,
            cropTarget.index,
            newPublicUrl
          );

          return;
        }

        /*
         * ========================================================
         * QUESTION IMAGE
         * ========================================================
         */

        const oldImage =
          q.images.length
            ? q.images[0]
            : null;

        const oldImageUrl =
          oldImage?.image_url ||
          null;

        /*
         * Insert new DB image first.
         */
        const {
          data: newImageRow,
          error: insertError
        } =
          await supabaseClient
            .from(
              'pyq_question_images'
            )
            .insert({
              question_id:
                q.id,

              image_url:
                newPublicUrl,

              page_number:
                parseInt(
                  document.getElementById(
                    'pageJumpInput'
                  ).value
                ) || null
            })
            .select()
            .single();

        if (
          insertError ||
          !newImageRow
        ) {
          await supabaseClient
            .storage
            .from('pyq-images')
            .remove([
              newPath
            ])
            .catch(
              () => {}
            );

          throw new Error(
            'Could not save question image: ' +
            (
              insertError?.message ||
              'Database insert failed'
            )
          );
        }

        /*
         * Delete old DB record.
         */
        if (oldImage) {
          const {
            error:
              oldDbDeleteError
          } =
            await supabaseClient
              .from(
                'pyq_question_images'
              )
              .delete()
              .eq(
                'id',
                oldImage.id
              );

          if (
            oldDbDeleteError
          ) {
            /*
             * New image is already safely saved.
             * Do not delete the new image.
             */
            throw new Error(
              'New image was saved, but the old image record could not be removed: ' +
              oldDbDeleteError.message
            );
          }
        }

        q.images = [
          newImageRow
        ];

        /*
         * Delete old Storage object.
         */
        if (
          oldImageUrl &&
          oldImageUrl !==
            newPublicUrl
        ) {
          await deleteOldStorageFile(
            oldImageUrl
          );
        }

        /*
         * Audit log.
         */
        await supabaseClient
          .from('pyq_review_log')
          .insert({
            question_id:
              q.id,
            admin_id:
              currentUserId,
            action:
              'image_replaced'
          });

        btn.disabled = false;

        btn.textContent =
          'Crop & Upload';

        cropModal.classList.remove(
          'show'
        );

        renderImageBox(q);

      } catch (error) {
        console.error(
          'Image replacement failed:',
          error
        );

        alert(
          'Image replacement encountered a problem:\n\n' +
          (error?.message ||
            error)
        );

        btn.disabled = false;

        btn.textContent =
          'Crop & Upload';
      }
    }
  );

  /*
   * ============================================================
   * PUBLISH PYQ
   * ============================================================
   */
  document.getElementById(
    'publishBtn'
  ).addEventListener(
    'click',
    async () => {
      if (
        !confirm(
          'Publish this PYQ? It will immediately become visible to students in the mock test list. ' +
          'After successful publication, the original source PDF will be permanently deleted from Storage. ' +
          'The questions, options, images, and review data will be retained.'
        )
      ) {
        return;
      }

      const btn =
        document.getElementById(
          'publishBtn'
        );

      btn.disabled = true;
      btn.textContent =
        'Publishing…';

      try {
        const {
          data,
          error
        } =
          await supabaseClient
            .functions
            .invoke(
              'publish-pyq-paper-v2',
              {
                body: {
                  paper_id:
                    paperId
                }
              }
            );

        if (error) {
          throw new Error(
            error.message ||
            'Could not publish the PYQ.'
          );
        }

        if (
          !data ||
          data.success !== true ||
          data.published !== true
        ) {
          throw new Error(
            data?.error ||
            'Publication could not be verified.'
          );
        }

        paper.status =
          'published';

        paper.is_published =
          true;

        paper.source_pdf_path =
          null;

        updateProgress();

        if (data.warning) {
          alert(
            'PYQ published successfully.\n\n' +
            'Source PDF was deleted, but there was a metadata warning:\n\n' +
            data.warning
          );
        } else {
          alert(
            'Published successfully.\n\n' +
            'The PYQ is now available to students and the original source PDF has been permanently removed from Storage.'
          );
        }

      } catch (e) {
        console.error(
          'Publish error:',
          e
        );

        btn.disabled = false;

        btn.textContent =
          'Publish PYQ';

        alert(
          'Could not publish the PYQ:\n\n' +
          (e?.message || e)
        );
      }
    }
  );

  function escapeHtml(s) {
    return String(s).replace(
      /[&<>"]/g,
      c =>
        ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;'
        }[c])
    );
  }

  function escapeAttr(s) {
    return escapeHtml(s);
  }

  /*
   * These footer buttons are static elements.
   * They are wired exactly once.
   */
  document
    .getElementById('prevBtn')
    .addEventListener(
      'click',
      () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderEditor();
        }
      }
    );

  document
    .getElementById('nextBtn')
    .addEventListener(
      'click',
      () => {
        if (
          currentIndex <
          questions.length - 1
        ) {
          currentIndex++;
          renderEditor();
        }
      }
    );

  document
    .getElementById('approveBtn')
    .addEventListener(
      'click',
      () =>
        approveCurrent()
    );

  /*
   * ============================================================
   * INITIALIZE
   * ============================================================
   */
  (async () => {
    const session =
      await guard();

    if (
      !session ||
      !paperId
    ) {
      return;
    }

    await loadAll();
  })();
</script>
</body>
