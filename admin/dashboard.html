<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Aspinora</title>
<style>
  :root{
    --orange:#ff7800;--orange-dark:#e85d00;--ink:#172033;--muted:#6d7585;
    --line:#edf0f5;--shadow:0 18px 55px rgba(34,45,72,.08);--red:#e5484d;--green:#3ecf7a;
    --blue:#367dd7;--purple:#7957db;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(145deg,#fffaf5 0%,#ffffff 45%,#fff8ef 100%);color:var(--ink)}
  .page{width:min(1100px, calc(100% - 36px));margin:0 auto;padding-bottom:60px}
  .topbar{height:86px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:36px;height:36px;display:block}
  .brand-name{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .brand-name span{color:var(--orange)}
  .top-actions{display:flex;gap:10px;align-items:center}
  .who{font-size:13px;color:var(--muted);font-weight:650}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:750;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--orange);color:#fff}
  .btn-primary:hover{background:var(--orange-dark)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:#394255}
  .btn-ghost:hover{border-color:#ffd0a8;color:var(--orange-dark)}
  .btn-red{background:#ffe9e9;color:var(--red)}
  .btn-red:hover{background:#ffdada}

  .hero{padding:28px 6%;border:1px solid #f8e6d6;border-radius:24px;background:linear-gradient(120deg,#fff 0%, #fffaf6 100%);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .hero h1{margin:0 0 6px;font-size:24px;letter-spacing:-.6px}
  .hero p{margin:0;color:var(--muted);font-size:14px}

  .list{margin-top:22px;display:flex;flex-direction:column;gap:14px}
  .paper-card{padding:20px 24px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 25px rgba(44,54,78,.04);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .paper-main{flex:1;min-width:220px}
  .paper-title{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
  .paper-sub{font-size:12.5px;color:var(--muted);font-weight:600}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
  .badge-uploaded{background:#eef1f5;color:#505b70}
  .badge-extracting{background:#fff3d6;color:#a5720a}
  .badge-extraction_failed{background:#ffe9e9;color:var(--red)}
  .badge-draft{background:#eaf4ff;color:var(--blue)}
  .badge-published{background:#eafaf1;color:#1c8f57}
  .progress-wrap{width:160px}
  .progress-track{height:8px;border-radius:99px;background:#eef1f5;overflow:hidden}
  .progress-fill{height:100%;background:var(--green);border-radius:99px}
  .progress-label{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:5px;text-align:right}
  .paper-actions{display:flex;gap:8px}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty h3{color:var(--ink);margin-bottom:6px}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand"><img src="../aspinora-logo.png" alt="Aspinora" class="brand-mark"><div class="brand-name">Aspi<span>nora</span> Admin</div></div>
    <div class="top-actions">
      <span class="who" id="whoLabel"></span>
      <button class="btn btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </header>

  <section class="hero">
    <div>
      <h1>PYQ Papers</h1>
      <p>Upload, review, and publish previous-year question papers for SSC CGL mock tests.</p>
    </div>
    <button class="btn btn-primary" onclick="window.location.href='upload.html'">+ Upload new PYQ PDF</button>
  </section>

  <div class="list" id="paperList">
    <div class="empty">Loading…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://tcufgyrhkpzkeyiffnaw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rhTVneW41uHvEX6PRkl8qw_mZ8BgQ9n';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const STATUS_LABEL = {
    uploaded: 'Uploaded',
    extracting: 'Extracting…',
    extraction_failed: 'Extraction failed',
    draft: 'In review',
    published: 'Published',
  };

  async function guard() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = '/auth'; return null; }
    const { data: isAdmin } = await supabaseClient.rpc('is_admin');
    if (!isAdmin) { await supabaseClient.auth.signOut(); window.location.href = '/auth'; return null; }
    document.getElementById('whoLabel').textContent = session.user.email;
    return session;
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '/auth';
  });

  async function loadPapers() {
    const listEl = document.getElementById('paperList');
    const { data: papers, error } = await supabaseClient
      .from('pyq_papers')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty"><h3>Could not load papers</h3><p>${error.message}</p></div>`;
      return;
    }
    if (!papers.length) {
      listEl.innerHTML = `<div class="empty"><h3>No PYQ papers yet</h3><p>Upload a PDF to get started.</p></div>`;
      return;
    }

    listEl.innerHTML = '';
    papers.forEach(p => {
      const pct = p.total_questions > 0 ? Math.round((p.approved_questions / p.total_questions) * 100) : 0;
      const card = document.createElement('div');
      card.className = 'paper-card';
      card.innerHTML = `
        <div class="paper-main">
          <div class="paper-title">${p.exam_name} ${p.year} — ${p.tier}</div>
          <div class="paper-sub">Held on ${p.exam_date}${p.shift && p.shift !== 'Single Shift' ? ' · ' + p.shift : ''}</div>
        </div>
        <span class="badge badge-${p.status}">${STATUS_LABEL[p.status] || p.status}</span>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${p.approved_questions}/${p.total_questions} reviewed</div>
        </div>
        <div class="paper-actions">
          ${p.status === 'draft' || p.status === 'published' || p.status === 'extraction_failed'
            ? `<button class="btn btn-ghost" data-review="${p.id}">Review</button>` : ''}
          ${p.status === 'extraction_failed'
            ? `<button class="btn btn-primary" data-retry="${p.id}">Retry extraction</button>` : ''}
          <button class="btn btn-red" data-remove="${p.id}" data-published="${p.status === 'published'}">Remove</button>
        </div>
        ${p.status === 'extraction_failed' && p.last_error
          ? `<div style="width:100%;font-size:12px;color:#a5232a;background:#fff0f0;border-radius:8px;padding:8px 12px;margin-top:4px">${escapeHtml(p.last_error)}</div>` : ''}
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('[data-review]').forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.href = `review.html?paper_id=${btn.dataset.review}`;
      });
    });
    listEl.querySelectorAll('[data-retry]').forEach(btn => {
      btn.addEventListener('click', () => {
        window.location.href = `upload.html?retry_paper_id=${btn.dataset.retry}`;
      });
    });
    listEl.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => removePaper(btn.dataset.remove, btn.dataset.published === 'true'));
    });

    // Auto-refresh while anything is mid-extraction (extraction runs in the
    // background and can take a few minutes), so status updates without
    // needing a manual reload.
    const stillWorking = papers.some(p => p.status === 'extracting');
    if (stillWorking) setTimeout(loadPapers, 5000);
  }

  async function removePaper(paperId, isPublished) {
    const warning = isPublished
      ? 'This PYQ is PUBLISHED — removing it will immediately take it away from students. Remove anyway?'
      : 'Remove this PYQ paper and all its extracted questions? This cannot be undone.';
    if (!confirm(warning)) return;

    const { data: paperRow } = await supabaseClient.from('pyq_papers').select('source_pdf_path').eq('id', paperId).single();

    const { error } = await supabaseClient.from('pyq_papers').delete().eq('id', paperId);
    if (error) { alert('Could not remove: ' + error.message); return; }

    // Best-effort cleanup of the source PDF (question images are left in
    // place — a minor storage cost, but not worth risking data loss over).
    if (paperRow?.source_pdf_path) {
      await supabaseClient.storage.from('pyq-source-pdfs').remove([paperRow.source_pdf_path]).catch(() => {});
    }

    loadPapers();
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  (async () => {
    const session = await guard();
    if (session) loadPapers();
  })();
</script>
</body>
</html>
